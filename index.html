ommand bar. The app stores data in a local SQLite database and is designed for one local user; authentication, external calendar sync, email delivery, push notifications, and background workers are out of scope. The initial build is complete across the concept, feature, environment, architecture, backend, and frontend stages, but formal verification has not completed yet.","tags":["fastapi","productivity","single-user","sqlite","task-management","web-app"],"tech":["Python","FastAPI","SQLAlchemy","SQLite","Jinja2","Bootstrap","JavaScript","SQL.js","Uvicorn"],"category":"Web Apps & Prototypes","live_url":"https://jpeckenpaugh.github.io/executive-assistant/","repo_url":"https://github.com/jpeckenpaugh/executive-assistant","has_live_demo":true,"featured":true,"status":"prototype","confidence":"high","notes":"Live GitHub Pages probe returned HTTP 200 with title 'Executive Assistant'. Repo has no description, no GitHub-reported license (README states MIT), and 0 stars. README notes the initial build is complete but formal verification has not finished; known items include reminder visibility on related detail pages and HTTP 422 validation response presentation. The live site appears to be the client-side poc-browser build (sql.js), while the main app is a FastAPI server intended to run locally on localhost:8000.","demos":[{"label":"Play","url":"https://jpeckenpaugh.github.io/executive-assistant/"}],"thumb":"thumbnails/executive-assistant.webp","updated_at":"2026-09-08T05:47:32Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":53,"live_final_url":"https://jpeckenpaugh.github.io/executive-assistant/","live_error":null},{"key":"herons-fountain","repo":"herons-fountain","display_title":"Heron's Fountain — 2D Simulation","tagline":"Interactive browser simulation of a pump-less Heron's fountain","short_description":"An interactive, browser-based 2D approximation of a Heron's fountain that shows how falling water compresses trapped air to drive a fountain jet without a pump.","long_description":"Heron's Fountain is a zero-dependency, browser-based 2D simulation of a Heron's fountain. It models three water regions (a fixed top Basin, sealed Chamber A, and sealed Chamber B) connected by pipes P1, P2, and P3, treating the two sealed air spaces as one shared volume at a single pressure. Physics uses a polytropic pressure-volume relation (P = P0 (V0 / V)^k, default isothermal k = 1) and an orifice flow approximation (Q = Cd A sqrt(2 dP / rho)) accounting for hydrostatic head, with water conserved as transferred volumes. The animated side view draws the apparatus, liquid flow, airflow, and a horizontal particle jet, with live readouts of elapsed time, jet velocity, flow rate, vessel volumes, and fill percentages. Controls include Invert (exchanging chamber elevations and reversing flow), Auto Invert with selectable triggers (jet speed, flow rate, chamber fill, elapsed cycle time, or settled condition) plus threshold and dwell, simulation Speed of 1x-16x, and Reset. It is a deliberate lumped approximation that omits turbulence, surface tension, viscosity, temperature change, and detailed inversion mechanics. No build step or external dependency is required; serve the directory as static files.","tags":["canvas","fluid-dynamics","interactive","physics","simulation"],"tech":["JavaScript","HTML5","Canvas"],"category":"Web Apps & Prototypes","live_url":"https://jpeckenpaugh.github.io/herons-fountain/","repo_url":"https://github.com/jpeckenpaugh/herons-fountain","has_live_demo":true,"featured":true,"status":"prototype","confidence":"high","notes":"Live probe returned HTTP 200 with title \"Heron's Fountain\". No CNAME in the repo, so the jpeckenpaugh.github.io/<repo>/ URL is used. No license declared. Only four files (index.html, physics.js, render.js, README.md) and no build step or dependencies.","demos":[{"label":"Play","url":"https://jpeckenpaugh.github.io/herons-fountain/"}],"thumb":"thumbnails/herons-fountain.webp","updated_at":"2026-08-31T11:34:46Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":54,"live_final_url":"https://jpeckenpaugh.github.io/herons-fountain/","live_error":null},{"key":"oblique-livive-net","repo":"oblique-livive-net","display_title":"Oblique · 2.5D World Sandbox","tagline":"Interactive 2.5D game-world workbench for dynamic Y-depth sorting, procedural terrain layers, and scene composition.","short_description":"A browser-based game workbench for testing sprite depth sorting, 12-angle turntable anchors, procedural 5-layer terrain substrates, and scene event choreography on an orthogonal grid.","long_description":"Oblique is an inspectable browser workbench exploring how layered terrain, water foam, dynamic Y-sorting, and directional silhouette shadows unite on an orthogonal 64×64 grid. Its modular applications include a 2.5D model sandbox with live sprite and anchor editing, solid obstacle collisions, and directional shadow feathering; a 5-layer procedural terrain engine with soloable Worley bedrock, Bayer-dithered turf, and translucent UV wave drift; a 16×16 scene-building Playground with terrain brush painting, sprite scaling, and event sequence scripting; and an atmospheric Beach Camp coastal scene study.","tags":["2.5d","game-assets","game-development","procedural-terrain","sandbox"],"tech":["JavaScript","HTML","CSS","Canvas"],"category":"Web Apps & Prototypes","live_url":"https://oblique.livive.net/","demos":[{"label":"Explore Oblique","url":"https://oblique.livive.net/"},{"label":"2.5D Model Sandbox","url":"https://oblique.livive.net/sandbox.html"},{"label":"Playground Scene Builder","url":"https://oblique.livive.net/playground.html"},{"label":"5-Layer Terrain POC","url":"https://oblique.livive.net/terrain-layers.html"},{"label":"Beach Camp Scene Study","url":"https://oblique.livive.net/beach-camp.html"}],"repo_url":"https://github.com/jpeckenpaugh/oblique-livive-net","has_live_demo":true,"featured":true,"status":"active experiments","confidence":"high","notes":"Repository README describes a browser-based 2.5D game-world workbench with four featured live pages: the model sandbox, the Playground scene builder (playground.html), Terrain Layers, and Beach Camp. Static HTML, CSS, and vanilla JavaScript; GitHub Pages deploys the repository root. The related Sprites model-to-sprite workshop is hosted at sprites.livive.net.","thumb":"thumbnails/oblique-livive-net.webp","updated_at":"2026-10-18T07:09:07.422Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":149,"live_final_url":"https://oblique.livive.net/","live_error":null,"how_to_play":[{"title":"🕹️ 1. Dynamic Y-Sorting & Obstacle Collision","body":"Walk the player character through the 64×64 world using WASD or arrow keys. Watch sprites sort dynamically along the Y-axis as characters weave behind and in front of houses, palms, and docks with directional silhouette shadows."},{"title":"🛠️ 2. Diagnostic Overlays & Live Sprite Editor","body":"Toggle footprint hitboxes, registration crosshairs, cyan bounds, and grid lines. Click any prop to scrub turntable frames (0–11 angles), reposition registration anchors, and tune shadow feathering in real time."},{"title":"🌊 3. Five-Layer Substrate Deconstruction","body":"Explore the procedural terrain engine in Terrain Layers. Use Solo buttons to isolate L1 Bedrock edge rifts, L2 Bayer-dithered retro turf, L3 Sand topsoil, L4 Translucent water & shoreline foam, and L5 2.5D props."},{"title":"🎨 4. Playground Scene Builder & Event Sequencer","body":"Craft 16×16 scenes with terrain brushes, place NPCs with custom orientations and scaling, toggle autonomous wandering, and choreograph story sequences with camera transitions and dialogue boxes."}]},{"key":"robot-motion-studio","repo":"robot-motion-studio","display_title":"Robot Motion Studio","tagline":"Design, simulate, and export PWM servo motion sequences for Arduino robots","short_description":"A web app for designing and managing PWM servo motor control sequences for Arduino-based robots, with configuration, reusable poses, a timeline editor, a Canvas simulator, and structured JSON export.","long_description":"Robot Motion Studio (Robot Servo Sequence Designer) is a local, single-user multi-robot motion designer for PWM servo robots. Users configure servo motors (PWM pin, angle limits, neutral angle, pulse calibration), create reusable poses, author ordered/timed motion sequences through a visual timeline editor (add/reorder/edit/duplicate steps, play/pause/scrub, per-step speed and easing), inspect resolved motion in a preview, watch it in a dependency-free browser Canvas simulator, and export robot-scoped JSON (schema_version 2) for Arduino firmware or other robot-control software. Motion timing supports easing curves, finite/forever sequence repeat, and contiguous step-group loops. A fresh database seeds a door-durability-tester rig (shoulder/elbow/wrist/gripper servos) plus demo robots: PickPlaceArm (6-DOF arm), QuadTrotter (quadruped), BipedWalker (biped), and GimbalCam (pan/tilt). The original edition pairs a FastAPI + SQLite backend with a static Bootstrap 5 SPA (no build toolchain); a browser-only edition replaces the backend with sql.js WebAssembly SQLite running in a Web Worker and OPFS persistence, making it fully static for GitHub Pages. It is a proof-of-concept and does not communicate with physical Arduino hardware or perform real-time control.","tags":["arduino","motion-sequencing","robotics","servo","web-app"],"tech":["JavaScript","Python","FastAPI","SQLite","Bootstrap 5","sql.js","WebAssembly","HTML/CSS"],"category":"Web Apps & Prototypes","live_url":"https://jpeckenpaugh.github.io/robot-motion-studio/","repo_url":"https://github.com/jpeckenpaugh/robot-motion-studio","has_live_demo":true,"featured":true,"status":"prototype","confidence":"high","notes":"Live GitHub Pages probe returned HTTP 200 with title 'Robot Motion Designer (Browser Edition)'. No CNAME in the repo, so the Pages URL jpeckenpaugh.github.io/robot-motion-studio/ is used; .github/workflows/deploy.yml publishes browser-edition/ to GitHub Pages. No repo description, homepage, license, or topics; 0 stars. Self-described proof-of-concept (POC) that does not talk to physical hardware. Two editions: server edition (FastAPI + SQLite + static Bootstrap SPA; pinned deps fastapi==0.115.6, uvicorn[standard]==0.34.0) and static browser edition (sql.js WASM SQLite in a Web Worker, OPFS persistence). Verification reports record v0.1 82/83 pass and Sprint-01 85/86 pass (one known FAIL each: preview staleness, fixed in Sprint 01 as I11/K8; stored step speed not recomputed on mutation as G7).","demos":[{"label":"Play","url":"https://jpeckenpaugh.github.io/robot-motion-studio/"}],"thumb":"thumbnails/robot-motion-studio.webp","updated_at":"2026-09-08T08:38:27Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":71,"live_final_url":"https://jpeckenpaugh.github.io/robot-motion-studio/","live_error":null},{"key":"vid-factory","repo":"vid-factory","display_title":"Video Content Factory","tagline":"Organize video content ideas and draft AI scripts with browser-native TTS","short_description":"A browser-centric web application for organizing early-stage video content ideas, managing catalogs of applications and companies, drafting scripts with client-side AI providers, and synthesizing dialogue with in-browser text-to-speech.","long_description":"Video Content Factory is a web application for organizing early-stage content ideas and drafts. Its primary local runtime is a browser-native standalone application (browser-edition/) that runs entirely client-side with no backend server: a dedicated Web Worker database layer uses vendored sql.js (SQLite compiled to WebAssembly) with persistence in the Origin Private File System (OPFS), communicating through an RPC message-passing protocol between the UI (app.js) ","repo":["lokarta","lokarta-v2","lokarta-v3","lokarta-v4"],"display_title":"Lokarta","tagline":"Come Into The Light — a retro 2D roguelike dungeon crawler in the browser","short_description":"A zero-backend, client-side 2D roguelike RPG with a real-time 10 Hz tick, dynamic light-and-darkness line-of-sight, and four playable vocations, evolved across four repositories from a Python terminal prototype to a native browser game.","long_description":"Lokarta: Come Into The Light is a retro-inspired, grid-based 2D roguelike RPG. The project exists as four iterations of the same game: the original lokarta is a local-first Python terminal proof of concept for a BBS-style ASCII RPG (fixed 100x30 screen, JSON-driven content packs, single-key input, engine/UI separation); lokarta-v2 is a browser edition built with TypeScript and Vite, rendered on an HTML5 2D Canvas with a companion FastAPI + SQLite backend for dungeon layout, loot seeding, and character state; lokarta-v3 rebuilds the game as a zero-backend, client-side application using native web standards (ES modules, Web Workers, Canvas 2D, Web Audio API, IndexedDB) with four vocations, a five-tier tower ascent, and a Havenreach town hub; lokarta-v4 is the most complete engine, adding a Dawnreach Isle overworld, an island quest chain, NPC actors, expanded sprite direction sets, and more Web Worker RPC handlers and data catalogs. Gameplay pillars include a light-versus-darkness mechanic where pitch-black chambers are only revealed within a torch or spell light radius, frictionless walkover auto-loot, a roguelike Fate Grant draft on level-up, and multi-modal inputs (tap, hold/charge, double-tap).","tags":["ascii","browser-game","dungeon-crawler","pixel-art","retro","roguelike"],"tech":["Python","TypeScript","JavaScript","Vite","HTML5 Canvas","Web Workers","IndexedDB","Web Audio API","ES Modules","FastAPI","SQLite","Pyodide","Vitest","pytest"],"category":"Games","live_url":"https://lk.livive.net/","demos":[{"label":"Play v4 ( weeper","short_description":"An in-browser retro arcade cabinet running ONNX-exported reinforcement-learning policies on a deterministic 8x8 Minesweeper engine. Play a seeded board, watch the AI reason with a live action mask and confidence heatmap, race a checkpoint on the same seed, or run the whole nine-model library in CONCURRENT mode.","long_description":"Minesweeper RL Arcade is an in-browser retro arcade cabinet built around a deterministic 8x8 Minesweeper engine and a library of ONNX-exported reinforcement-learning policies. It has five modes: PLAY, where you clear a seeded board with a guaranteed-safe first click; AI, where a selected checkpoint plays the same seed with live confidence, per-cell distributions, and a legal-action mask; RACE, a side-by-side human-vs-policy comparison on an identical seed; CONCURRENT, where every checkpoint in the library steps through one board in lockstep with a CLEARED/DETONATED/STUCK scoreboard and points-sorted leaderboard; and MODELS, a details panel for each manifest checkpoint (family, method, architecture, training recipe, file size, and fixed-seed evaluation). The v2 library ships nine documented checkpoints across four families — a uniform baseline, solver-imitation behaviour clones, REINFORCE policy-gradient models, and kernel/single-conv ablations — evaluated from 0% to 61.4% win rate. The app is a static ES-module bundle that fetches models/manifest.json and runs inference through the pinned onnxruntime-web CDN; the engine, featurization, and action-mask contract stay frozen so scores remain comparable across checkpoints. It deploys to GitHub Pages from main at mines.livive.net, guarded by a smoke workflow that asserts the app, the manifest, and every model file are served live.","tags":["arcade-cabinet","browser-game","minesweeper","onnx","onnxruntime","policy-imitation","reinforcement-learning"],"tech":["JavaScript","HTML","CSS","ONNX Runtime Web","Python","PyTorch","Stable-Baselines3"],"category":"Games","live ates ONNX embeddings, builds an in-memory vector index, and runs local WebGPU language models entirely in the browser with no backend or external APIs.","long_description":"Northstar RAG POC is a static single-page application demonstrating retrieval-augmented generation entirely inside the browser with zero backend and zero external API calls. It extracts per-page text from PDFs using PDF.js, splits documents with a sliding-window chunker, generates embeddings via Transformers.js ONNX models, and stores 367 chunk vectors as contiguous Float32Array buffers in JavaScript heap memory for linear dot-product similarity search. Answers are generated by WebLLM with WebGPU acceleration, hot-swapping between Llama-3.2-1B, SmolLM2-1.7B, Qwen2.5-0.5B, and Qwen2.5-1.5B, or by four ONNX embedding models. When WebGPU is unavailable it falls back to a semantic retrieval view showing ranked matches and cosine scores. The demo is preloaded with 21 fictional Northstar Urgent Care Cooperative operational policy PDFs (64 pages) plus a 15-query evaluation benchmark including guardrail abstention cases. Built-in developer tools include a canvas PDF viewer, chunk visualizer, vector math inspector, raw prompt preview, and hardware diagnostics. It is hosted on GitHub Pages as a fully static bundle.","tags":["browser","embeddings","llm","on-device","rag","vector-search"],"tech":["TypeScript","React","Vite","Tailwind CSS","Transformers.js","WebLLM","PDF.js","WebGPU"],"category":"AI/ML Experiments","live_url":"https://jpeckenpaugh.github.io/rag-poc/","repo_url":"https://github.com/jpeckenpaugh/rag-poc","has_live_demo":true,"featured":true,"status":"prototype","confidence":"high","notes":"Live probe returns HTTP 200 with title 'Northstar RAG POC'; no CNAME found so used the GitHub Pages URL. Self-described proof-of-concept; status set to prototype. Featured because it has a working live demo. All corpus organizations, people, and policies are fictional.","demos":[{"label":"Play","url":"https:/ ,"TFLite","LiteRT.js","numpy","pronouncing","HTML","JavaScript","WASM"],"category":"AI/ML Experiments","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/ai_chat_distil_01","has_live_demo":false,"featured":false,"status":"experiment","confidence":"high","notes":"No GitHub Pages and no CNAME, so no live URL. Description and README self-describe this as an experimental proof-of-concept. Single initial commit window (created and last pushed 2026-01-11); 0 stars.","demos":[],"thumb":"thumbnails/ai_chat_distil_01.webp","updated_at":"2026-01-11T12:06:52Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"cde","repo":"cde","display_title":"Compiled Domain Expertise (CDE)","tagline":"Compiling bounded AI reasoning into static, deterministic instruction sets","short_description":"Compiled Domain Expertise (CDE) is an architectural specification that compiles bounded AI reasoning into a static, language-agnostic Domain Instruction Set, replacing runtime neural nets with a deterministic, sub-megabyte relational graph.","long_description":"CDE proposes severing knowledge acquisition from knowledge execution. At build time, high-capacity models operate offline as an empirical knowledge compiler (Empirical Knowledge Compilation, EKC) to explore a closed domain, extract candidate reasoning structures, and surface inferential dependencies. At runtime, only surviving validated structures execute after being lowered into a Domain Instruction Set (DIS). The Quantized Semantic Bottleneck Architecture (QSBA) uses an hourglass topology that decouples continuous, high-dimensional linguistic transducers from a discrete, integer-only core, targeting exact attribution, loud syntax checks, and microsecond execution on standard CPUs within a sub-megabyte budget. The repo includes the specification, a CCPA reference instance (QSBC), an algebra domain with an ingest/review workbench (FastAPI backend + React frontend), supporting dialogues, docs, and generated slide decks.","tags":["ai","deterministic-inference","knowledge-compilation","llm","symbolic-ai"],"tech":["python","fastapi","sqlalchemy","pymupdf","typescript","react","vite","tailwindcss"],"category":"AI/ML Experiments","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/cde","has_live_demo":false,"featured":false,"status":"experiment","confidence":"high","notes":"Dossier live probe list is empty; GitHub Pages disabled and homepage null, so no live demo. Primary artifact is an architectural specification (README) plus an algebra EKC workbench with a FastAPI/SQLAlchemy backend and React/Vite/Tailwind frontend. Apache-2.0 licensed, 0 stars, last pushed 2026-09-20.","demos":[],"thumb":"thumbnails/cde.webp","updated_at":"2026-09-20T18:01:52Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"qsbc","repo":"qsbc","display_title":"QSBC — Quantized Semantic Bottleneck Classifier","tagline":"Interpretable sentence classification via a semantic proposition bottleneck","short_description":"Infrastructure and experiments for QSBC, an interpretable sentence-classification architecture that inserts a human-meaningful semantic proposition bottleneck between input text and linear-probe prediction, applied to the CPRA subset of the C3PA privacy-policy dataset.","long_description":"QSBC replaces the direct text-to-label mapping of an uninterpretable transformer with a two-stage path: concept extraction, then a strictly linear probe, so concept attribution to class logits is analytically exact. This repo builds the data layer and experiments: a Dockerized PostgreSQL corpus of the parsed C3PA privacy policies matching the reference split, a chain-of-thought `cot` agent that generates atomic generalized rationales per sentence-label pair, the Phase 2 thoughts/ideas alphabet (statements clustered into canonical concepts), a FastAPI + Bootstrap SPA explorer, and Colab experiment notebooks (exp1-4) benchmarking the pipeline with a linear-probe ceiling reported at +9.8pt.","tags":["classification","interpretability","nlp","privacy-policies","semantic-bottleneck"],"tech":["python","fastapi","uvicorn","postgresql","docker","scikit-learn","sentence-transformers","jupyter"],"category":"AI/ML Experiments","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/qsbc","has_live_demo":false,"featured":false,"status":"experiment","confidence":"high","notes":"No live probe results (dossier live: []); has_pages false and homepage null, so no live_url. Runs locally via docker compose on http://localhost:8000.","demos":[],"thumb":"thumbnails/qsbc.webp","updated_at":"2026-09-11T02:05:01Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"rag-data-synthesizer","repo":"rag-data-synthesizer","display_title":"RAG Data Synthesizer","tagline":"Build realistic fictional document corpora for RAG development and testing","short_description":"An agentic workflow and Python toolset to draft, reconcile, visualize, and render realistic fictional document collections for developing and evaluating RAG pipelines.","long_description":"RAG Data Synthesizer is a workflow and toolset for building realistic fictional document collections for retrieval-augmented generation development and evaluation. It supports collection planning, staff-authored source documents, fact and relationship tracking, visual assets, PDF rendering, and release review. The repository does not automatically generate document prose; a coordinator uses bounded author and reviewer agents to draft and reconcile content, while scripts generate scenario visuals and render approved Markdown to searchable PDFs. Its first scenario is the Northstar Urgent Care Cooperative, a fictional three-site clinic network, with 21 approved Markdown documents, rendered PDFs totaling 64 pages, a staff registry, cor ,"short_description":"A single-page, dependency-free language tutor for learning English-to-Hindi and English-to-Kannada vocabulary, with flashcards, quizzes, a searchable glossary, audio pronunciation, and progress tracking.","long_description":"A single-page, client-side language tutor for learning English/Hindi/Kannada vocabulary, built with no build tools and no dependencies — just HTML, CSS, and vanilla JavaScript. It covers two target languages: English to Hindi (Devanagari) or English to Kannada, selectable on the title screen or via a header dropdown. The curriculum spans 35 lessons and 700 words (20 per lesson), each with a phonetic transliteration. Learners get audio pronunciation via the Web Speech API using the correct voice per language (hi-IN / kn-IN), flip-to-reveal flashcards, per-lesson multiple-choice quizzes with instant feedback, a searchable glossary, and a dashboard with quiz score history, daily streaks, and per-word mastery tracked separately per language. Progress, language choice, and student name persist in localStorage, and the responsive layout adapts to any screen size. The README notably documents that the project was built entirely by three short-lived DeepSeek V4 Flash coding agents in OpenCode, with agent session screenshots included as evidence.","tags":["flashcards","hindi","kannada","language-learning","text-to-speech","vocabulary"],"tech":["HTML","CSS","JavaScript","Web Speech API","localStorage","Python"],"category":"Language Tools","live_url":"https://jpeckenpaugh.github.io/vibe-hindi-language-tutor/","repo_url":"https://github.com/jpeckenpaugh/vibe-hindi-language-tutor","has_live_demo":true,"featured":true,"status":"active","confidence":"high","notes":"GitHub Pages live demo returns HTTP 200. README describes project as v0.3, a work in progress. No license or homepage metadata found; built entirely by coding agents as a demonstration of agentic 'vibe coding'.","demos":[{"label":"Play","url":"https://jpeckenpaugh.github.io/vibe-hindi-language-tutor/"}],"thumb":"thumbnails/vibe-hindi-language-tutor.webp","updated_at":"2026-08-19T07:06:38Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":56,"live_final_url":"https://jpeckenpaugh.github.io/vibe-hindi-language-tutor/","live_error":null},{"key":"nexttext","repo":"nexttext","display_title":"nexttext","tagline":"Lightweight Python toolkit for neutralizing gendered language in AI text.","short_description":"A dependency-free Python library that debiases and rebias gendered terms in text labels using fast heuristics, for cleaning training data and filtering model outputs.","long_description":"nexttext is a lightweight Python toolkit for neutralizing and re-framing text to reduce noise, hidden skew, and unwanted artifacts in AI pipelines. It works on both human-annotated input labels and model-generated labels, using simple, fast heuristics to neutralise gendered or stereotypical language (debias) and optionally reintroduce controlled skew for testing and validation (rebias), including a context-aware strategy. It ships with no heavy dependencies, requires Python 3.9+, and is released under the MIT license, targeting tasks like training data cleanup, inference filtering, and standardization of labels across datasets.","tags":["ai-ethics","data-cleaning","debias","nlp","python-library","text-processing"],"tech":["Python","hatchling","pytest"],"category":"Language Tools","live_url":"https://jpeckenpaugh.github.io/nexttext/","demos":[{"label":"Play","url":"https://jpeckenpaugh.github.io/nexttext/"}],"repo_url":"https://github.com/jpeckenpaugh/nexttext","has_live_demo":true,"featured":true,"status":"active","confidence":"high","notes":"Published to GitHub Pages at https://jpeckenpaugh.github.io/nexttext/ (HTTP 200); previously repo-only. Also a reusable pip-installable library (pyproject name=nexttext, v0.1.0) with MIT license.","thumb":"thumbnails/nexttext.webp","updated_at":"2026-10-15T06:04:39Z","live_ok" false) and no CNAME, so no live URL; demo is served locally via scripts/stage4/serve-demo.sh. Repo has 0 stars and no license.","demos":[],"thumb":"thumbnails/apertiasm-en-es.webp","updated_at":"2026-03-03T02:50:51Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"c3pa-sentence-label-parser","repo":"c3pa-sentence-label-parser","display_title":"C3PA Sentence-Level Candidate Parser","tagline":"Parse C3PA privacy-policy annotations into aligned sentence-level ML dataset candidates.","short_description":"A Python parser that extracts grammatical sentences from C3PA privacy-policy HTML and aligns the dataset's verbatim annotations back to those sentences, producing ready-to-use sentence-level ML dataset candidates.","long_description":"A Python parser for turning the C3PA Dataset (California Consumer Privacy Act annotations on privacy policies) into structured sentence-level dataset candidates for ML/AI training and evaluation. It extracts readable policy text from the original HTML documents, segments it into full grammatical sentences with spaCy, and aligns C3PA annotation evidence back to those reconstructed sentences using a three-tier algorithm (sub-sentence fragments, multi-sentence paragraph spans, and partial token-overlap matches). Annotation labels are preserved verbatim. Outputs are split into single-label, high-confidence single-label, multi-label, and unannotated sentence CSVs, plus unmatched and ambiguous annotation files, for use in sentence classification, policy auditing, retrieval, and negative sampling.","tags":["annotation","ccpa","dataset","nlp","privacy-policy","sentence-segmentation"],"tech":["Python","spaCy","BeautifulSoup4","Bash","CSV"],"category":"Language Tools","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/c3pa-sentence-label-parser","has_live_demo":false,"featured":false,"status":"prototype","confidence":"high","notes":"No homepage, no GitHub Pages ed first POC build of the Snowflake contract intelligence platform over 510 CUAD contracts.","short_description":"The clean, automated first POC build of the Snowflake legal contract compliance and intelligence idea. Loads the 510-contract CUAD corpus into Snowflake with full-text clause search, related-contract scoring, RBAC roles (lawyer, auditor, admin), and an append-only access audit log.","long_description":"Snow CUAD implements the clean, automated first POC build of the Snowflake legal-compliance platform idea (paired with the snow-compliance-demo board-review architecture). Using the public Contract Understanding Atticus Dataset (CUAD v1 — 510 commercial M&A contracts annotated across 41 legal clause categories), this repository delivers an end-to-end reproducible pipeline from \\\"make pipeline\\\" through a self-hosted Streamlit legal exploration console.\\n\\nFeatures include:\\n• Fast clause search with query highlighting and surrounding contract context spans\\n• Structured filtering by 41 clause categories, agreement types, jurisdictions, and counterparties\\n• Related contract recommendations scored by shared counterparties, clause overlap, and agreement types\\n• Least-privilege multi-role RBAC (Lawyer, Auditor, Admin) powered by Snowflake service credentials rather than ACCOUNTADMIN\\n• Append-only access audit logging capturing all search queries, contract inspections, and user sessions.","tags":["cuad","snowflake","legal-tech","streamlit","data-governance","rbac","audit","sql","proof-of-concept"],"tech":["Python","Snowflake","Streamlit","SQL","NDJSON","GitHub Pages","GitHub Actions","Docker"],"category":"Dev Tools","live_url":"https://snow-cuad.livive.net/","demos":[{"label":"Live Documentation & Demo","url":"https://snow-cuad.livive.net/"},{"label":"Full 720p Video Walkthrough","url":"https://snow-cuad.livive.net/docs/assets/demo-720p.mp4"},{"label":"Architecture & Schema","url":"https://github.com/jpeckenpaugh/snow-cuad/blob/main/docs/architecture.md"}],"repo_url":"https://github.com/jpeckenpaugh/snow-cuad","has_live_demo":true,"featured":true,"status":"live","confidence":"high","notes":"Clean, automated first working POC build of the snow-compliance-demo idea. Automated end-to-end Snowflake pipeline and self-hosted Streamlit UI with 510 contracts from CUAD v1. Live site at snow-cuad.livive.net.","thumb":"thumbnails/snow-cuad.webp","live_ok":true,"live_status":200,"live_checked_at":"2026-10-18T01:00:00Z","live_latency_ms":60,"live_final_url":"https://snow-cuad.livive.net/","live_error":null,"updated_at":"2026-10-18T00:52:05Z","how_to_play":[{"title":"🔍 Clause Search & Highlighting","body":"Search clause text across all 510 contracts with query term hits highlighted in amber and full context spans preserved for legal diligence review."},{"title":"📑 Multi-Dimensional Browsing & Related Contracts","body":"Filter by 41 legal clause categories, agreement types, jurisdictions, and counterparties, and view automatically scored related contracts based on clause overlap."},{"title":"🛡️ Least-Privilege RBAC & Append-Only Audit Logging","body":"Authenticate as Lawyer, Auditor, or Admin under dedicated service credentials (never ACCOUNTADMIN) while all logins, clause searches, and document views stream to Snowflake audit tables."}]},{"key":"sprites-livive-net","repo":"sprites-livive-net","display_title":"Sprites · Model-to-Sprite Workshop","tagline":"Turn 3D GLB/glTF models into sprite sheets and single sprites in your browser","short_description":"A browser-based 3D-to-sprite workshop for previewing turntable views and animation frames, then exporting sprite sheets or cropped single sprites.","long_description":"Sprites is a static, browser-based 3D-to-sprite workshop. Select a GLB/glTF model and animation clip, preview sampled views and frames, configure camera pitch, view count, output dimensions, and background, then render and export a row-major PNG or adaptive-palette WebP sprite sheet. It also supports capturing a single angle with automatic bounds cropping, optional JSON metadata, and optional derived diagonal animation directions. The project is a companion asset-preparation tool for the Oblique 2.5D scene sandbox.","tags":["3d-models","game-assets","glb","sprite-sheets","web-tool"],"tech":["JavaScript","HTML","CSS","Three.js","WebGL"],"category":"Dev Tools","live_url":"https://sprites.livive.net/","demos":[{"label":"Open the sprite workshop","url":"https://sprites.livive.net/"},{"label":"Oblique Sandbox","url":"https://oblique.livive.net/"}],"repo_url":"https://github.com/jpeckenpaugh/sprites-livive-net","has_live_demo":true,"featured":true,"status":"active","confidence":"high","notes":"Live site title is 'Model Browser · Turntable'. README describes a browser-based 3D-to-sprite workshop and links to the companion Oblique sandbox. Static site; Three.js is loaded from jsDelivr.","thumb":"thumbnails/sprites-livive-net.webp","updated_at":"2026-10-15T16:47:11Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":181,"live_final_url":"https://sprites.livive.net/","live_error":null},{"key":"roblox-api-database","repo":"roblox-api-database","display_title":"Roblox API Database","tagline":"Git-tracked Roblox Client and Studio API dumps for offline schema lookup","short_description":"A git-tracked database of official Roblox Client and Studio API dumps, with Python CLI tools for offline schema lookup, static analysis, and CI/CD validation.","long_description":"Roblox API Database is a versioned, git-tracked collection of official Roblox Client and Studio API dumps fetched from Roblox CDN endpoints. It stores timestamped JSON API snapshots under versions/ with a current/ symlink to the latest dump, and ships lightweight self-contained Python CLI tools (query_api.py, validate_api.py, fetch_api_dump.sh) for looking up enums, classes, inheritance, properties, methods, and events without reading the multi-megabyte dump directly. It is designed for offline engine schema lookup, static analysis, and programmatic validation in CI/CD pipelines, and can be added to projects as a git submodule. Only Python 3.x and the standard library are required; a unittest suite and valid/invalid Lua sample folders support testing.","tags":["api","ci-cd","cli","database","roblox","static-analysis"],"tech":["Python","Lua","JSON","Shell","Git"],"category":"Dev Tools","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/roblox-api-database","has_live_demo":false,"featured":true,"status":"active","confidence":"high","notes":"No live probe results and no GitHub Pages/CNAME, so no live demo. Reusable CLI tooling and git-submodule design; recently pushed, not archived.","demos":[],"thumb":"thumbnails/roblox-api-database.webp","updated_at":"2026-06-26T15:17:00Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"gemini_bootstrap","repo":"gemini_bootstrap","display_title":"Gemini CLI Agent Bootstrap","tagline":"Persistent instructions, directives and memory for the Gemini CLI agent","short_description":"A Markdown-based framework that bootstraps Google Gemini Agent CLI sessions with persistent instructions, custom directives and session memory to reduce context decay, role drift and recall gaps.","long_description":"gemini_bootstrap is a framework for customizing interactive sessions with the Google Gemini Agent CLI. Its core is gemini_bootstrap.md, an operating manual the agent reads at the start of a session to configure behavior. It provides guiding principles, an extensible shorthand directive language, snapshot/undo for files, automatic 5-letter directory aliases for workspace folders, and session logging via templates. It targets problems like context decay, role drift, state desynchronization and directive sprawl, and uses Git as a persistence layer so the configuration and logs stay consistent across environments. Setup involves creating a ~/gemini/ workspace, cloning the repo, and optionally auto-loading the bootstrap on session start.","tags":["ai-agent","cli","context-management","gemini","llm","prompt-engineering"],"tech":["Markdown","Google Gemini CLI","Git"],"category":"Dev Tools","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/gemini_bootstrap","has_live_demo":false,"featured":false,"status":"active","confidence":"high","notes":"No live probe results in dossier (live: []) and has_pages is false, so no live demo. Pure Markdown repo (5 .md files, no manifests); tech inferred from README references to Markdown, Gemini CLI and Git. MIT licensed, 0 stars.","demos":[],"thumb":"thumbnails/gemini_bootstrap.webp","updated_at":"2025-10-12T05:27:42Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"open-code-workflows","repo":"open-code-workflows","display_title":"Open Code Workflows","tagline":"Role-based agent pipelines that turn a seed concept into a web app","short_description":"Reusable Markdown-defined agent pipelines (build, enhancements, debug) that drive a staged, human-checkpointed build of a web app from a seed concept via stage-managed sub-agents.","long_description":"Open Code Workflows is a reusable set of role-based pipelines for building web apps with an agentic coding assistant. Given a short seed concept, the workflows drive a staged build with human checkpoints through clearly separated roles: concept (human-supplied), feature decomposition, feature briefs, system engineering, architecture, backend, frontend, verification, and documentation. Three pipelines are provided: build (stages 01-09), enhancements (stages 01-10), and debug (stages 01-03). A meta Stage Manager role sequences, dispatches, gates, and audits each stage, spawning and resuming sub-agents per role. The repo includes ready-made seed concepts such as a language tutor, job tracker, client project tracker, sales/inventory tracker, plant nursery, and capstone project tracker. Each generation follows a fixed artifact chain (concept to features to briefs to env scripts to architecture to backend to frontend to verification to README); stages commit and push as their final step. It was designed and validated in OpenCode with DeepSeek V4 Flash but is model- and agent-agnostic, written as plain Markdown instructions.","tags":["agent-workflows","code-generation","opencode","pipelines","sub-agents","web-apps"],"tech":["Markdown","OpenCode","DeepSeek V4 Flash","FastAPI","SQLite","Bootstrap"],"category":"Dev Tools","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/open-code-workflows","has_live_demo":false,"featured":false,"status":"active","confidence":"high","notes":"No homepage, no GitHub Pages, and empty live probe; no live demo. Repo is Markdown-only (37 .md files) with no manifests. License: MIT. Model- and agent-agnostic instructions validated in OpenCode; notable but not a library and has no live demo, so featured is false.","demos":[],"thumb":"thumbnails/open-code-workflows.webp","updated_at":"2026-08-30T19:09:41Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null}]},{"category":"Education & Teaching","projects":[{"key":"tc-livive-org","repo":"tc-livive-org","display_title":"Training vs. Inference","tagline":"Interactive AI Learning Lab demystifying Training, Inference, and Hardware Memory with zero black boxes.","short_description":"A browser-based interactive learning lab that demystifies how AI models learn and predict through inspectable hardware abstractions, disk-to-RAM compilation, and hand-verifiable math.","long_description":"Training vs. Inference is an inspectable single-page educational app built with a strict Zero-Black-Boxes philosophy. Designed to teach non-technical leaders and engineers how AI actually works at the hardware level, it contrasts dormant disk storage against active RAM lookups, walks through a two-step training compilation pipeline, and exposes model blind spots on out-of-vocabulary words. Every token tally, weight, smoothing calculation, and confidence score is rendered transparently in the live DOM with zero hidden libraries.","tags":["ai","education","interactive","machine-learning","neural-networks","sentiment-analysis"],"tech":["HTML5","CSS3","JavaScript","GitHub Pages"],"category":"Education & Teaching","live_url":"https://tc.livive.org/","repo_url":"https://github.com/jpeckenpaugh/tc-livive-org","has_live_demo":true,"featured":true,"status":"active","confidence":"high","notes":"CNAME file points to tc.livive.org, so the custom https domain is preferred over the jpeckenpaugh.github.io/tc-livive-org/ Pages URL (live probe returned 200). No README; evidence drawn from index.html title and the three spec markdown files (concept_specification.md, reframed.md, spec_rev_2.md). Zero external dependencies per specs.","demos":[{"label":"Launch Lab","url":"https://tc.livive.org/"}],"thumb":"thumbnails/tc-livive-org.webp","updated_at":"2026-10-18T07:09:07.422Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":140,"live_final_url":"https://tc.livive.org/","live_error":null,"how_to_play":[{"title":"💾 1. Disk Storage vs. Active RAM","body":"Observe how raw training samples sit dormant on SSD disk storage with zero predictive power until an explicit CPU compilation step distills them into a compact lookup table loaded into RAM."},{"title":"🎯 2. Uncover AI Blind Spots (OOV)","body":"Evaluate unseen sentences against small models in View 2 to discover why models fail on Out-of-Vocabulary (OOV) words, falling back to an uncalibrated 50/50 coin toss."},{"title":"📈 3. Data Scaling & Token Coverage","body":"Scale the training dataset in View 3 to observe active RAM vocabulary expand from 6 to 38 tokens, instantly resolving blind spots and achieving high-confidence predictions."},{"title":"🔬 4. Inspect Live Laplace Smoothing Math","body":"Type your own sentences in View 4 and watch the processor calculate confidence in real time using inspectable Laplace smoothing: Score = (P + 1) / (P + N + 2)."}]},{"key":"docker-sql-lessons","repo":"docker-sql-lessons","display_title":"Docker SQL Lessons","tagline":"Hands-on Docker lessons for support engineers moving into DevOps","short_description":"A two-part, self-contained lesson series that builds small Dockerized Python apps to teach containers, volumes, and SQLite-backed persistence.","long_description":"Docker Lessons is a hands-on teaching series aimed at support engineers transitioning into DevOps. Each numbered folder is an independent lesson that builds a small Dockerized Python app and ships with its own README covering goals, files, and exercises. Lesson 1 (01-monitor) runs a long-lived daemon that samples CPU/RAM/Disk on an interval, stores each snapshot in SQLite, and lets students query the history with the sqlite3 CLI, teaching images vs containers, Dockerfile basics, bind mounts vs named volumes, and env-var config. Lesson 2 (02-lesson-catalogue) containerizes a FastAPI JSON API with a SQLite (SQLAlchemy) backend that tracks lessons and notes, covering port exposure, hot-reload via bind mount, CRUD endpoints, and Pydantic schemas. Prerequisites are Docker Desktop and basic command-line familiarity.","tags":["devops","docker","fastapi","sqlite","tutorial"],"tech":["Docker","Docker Compose","Python 3.12","SQLite","FastAPI","SQLAlchemy","Pydantic","psutil"],"category":"Education & Teaching","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/docker-sql-lessons","has_live_demo":false,"featured":false,"status":"active","confidence":"high","notes":"No description or homepage set on GitHub; no CNAME and Pages disabled, so no live URL. 18 files across two lessons; top-level docker-compose.yml runs the Lesson 1 monitor service. Uses psutil==6.1.0 pinned, other deps unpinned.","demos":[],"thumb":"thumbnails/docker-sql-lessons.webp","updated_at":"2026-08-16T20:55:37Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"fast-ttt","repo":"fast-ttt","display_title":"fast-ttt","tagline":"ASCII tic-tac-toe over HTTP, played with curl to teach client/server","short_description":"A text-based tic-tac-toe game served by FastAPI that responds in pure plain text, playable by two players using curl or a browser.","long_description":"fast-ttt is a minimal teaching tool that demonstrates client/server principles using a game of tic-tac-toe. Two players interact over plain HTTP with curl or a web browser, and the FastAPI server replies with ASCII boards and text only — no HTML, JavaScript, CSS, or JSON (the sole exception being FastAPI's auto-generated Swagger UI at /docs). It supports creating games, viewing boards, playing numbered moves, random auto-moves, per-game move history, and home-page statistics, with winning lines highlighted. Game state is persisted in SQLite via SQLAlchemy, and moves commit atomically across board, turn, status, and history. Docs (OVERVIEW.md and FAST-API.md) are served by the app itself to explain how clients and servers communicate.","tags":["cli","game","http","plain-text","teaching","tic-tac-toe"],"tech":["Python","FastAPI","uvicorn","SQLAlchemy","SQLite","pydantic","pytest","httpx"],"category":"Education & Teaching","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/fast-ttt","has_live_demo":false,"featured":false,"status":"prototype","confidence":"high","notes":"No GitHub Pages and no CNAME, so live_url is null. Positioned by the README as a teaching tool for client/server concepts rather than a standalone game, hence Education & Teaching. Local-only server at 0.0.0.0:8000.","demos":[],"thumb":"thumbnails/fast-ttt.webp","updated_at":"2026-08-18T20:31:40Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"python_classes","repo":"python_classes","display_title":"Python Classes Demo","tagline":"Progressive Python OOP demos with a food domain: inheritance and composition.","short_description":"A small, progressive set of Python examples demonstrating classes, inheritance, composition, polymorphism, and simple stateful business rules using a food-themed domain.","long_description":"Python Classes Demo is a small, progressive demonstration of Python object-oriented programming built around a food-themed domain. Base classes and subclasses are defined in food.py (Food with Fruit, Meat, and Beverage) and person.py (Person with Vegetarian), while meal.py illustrates composition through a Meal that contains multiple Food items. The examples show inheritance and method overriding (Fruit.eat, Meat.eat, Beverage.drink), composition, polymorphism, and state and validation held inside methods. Simple domain rules are modeled, including mandatory hand-washing before eating or drinking, requiring fruit to be washed and ripe and meat to be cooked before eating, vegetarian restrictions, allergies, a one-fruit limit for diabetics, an age 21+ check for alcoholic beverages, and people only becoming full at the end of a meal. Eight numbered example scripts progress from a minimal Person and Food case (example01.py) through cooking, washing/ripening, allergies and dietary limits, beverages, and a full Meal demo (example.py). Each example runs directly with python example01.py, and no manifest or third-party dependencies are present.","tags":["composition","education","inheritance","oop","python","tutorial"],"tech":["Python"],"category":"Education & Teaching","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/python_classes","has_live_demo":false,"featured":false,"status":"prototype","confidence":"high","notes":"Dossier live probe list is empty and has_pages is false, so no live demo exists and live_url is null. No license declared and no manifests. Content is 11 Python files plus README.md (13 files total), a self-contained command-line teaching demo with no dependencies.","demos":[],"thumb":"thumbnails/python_classes.webp","updated_at":"2026-02-08T02:42:39Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null}]},{"category":"Web Apps & Prototypes","projects":[{"key":"c3pa-explorer","repo":"c3pa-explorer","display_title":"C3PA Explorer","tagline":"In-browser explorer for the C3PA privacy-policy dataset","short_description":"A proof-of-concept web app for exploring the C3PA Dataset (400 expert-annotated CCPA/CPRA privacy policies) at both the source level (verbatim annotator spans) and the deterministically re-extracted derived level.","long_description":"C3PA Explorer is a proof-of-concept web app for exploring the C3PA Dataset (400 expert-annotated privacy policies, CCPA/CPRA) at both the source level (verbatim annotator spans) and the derived level (deterministically re-extracted text units). It ships two runtimes sharing one SPA and SQLite schema: a FastAPI edition with a Python backend over a normalized SQLite database, and a browser edition running entirely in-browser on sql.js (SQLite compiled to WebAssembly) against a prebuilt, signed snapshot. The derived layer is produced by backend/extract.py, a fully deterministic rule-based pipeline (no trained models) that drops chrome, extracts leaf text blocks, merges lead-ins with lists, splits sentences with abbreviation/URL/email guards, classifies units as sentence or typed fragment, and performs 3-tier annotation re-alignment. A dashboard shows corpus stats and label distributions; documents can be browsed and searched, document detail has Source/Sentences/Fragments tabs with clickable alignment provenance, and a unit explorer supports filtering and exporting timestamped ZIP archives with partition files and meta.json. The browser edition auto-loads a signed snapshot (verified against envelope and db hashes in builds.json kflows rather than a full CRM. Features include browsing and searching companies, country filtering, editable company profiles, standardized industries and locations, per-company references, news and logos, file/artifact upload and download, and one-page PDF summary generation. Sprint 03 added role-based access (guest, read-only, user, admin), admin user management, and optional Google SSO. The backend is FastAPI on async SQLAlchemy 2.0 with SQLite and versioned Alembic migrations, auth via fastapi-users with cookie sessions, and a static Bootstrap SPA frontend served by the app. It also ships OpenCode tools and agents that use the same authenticated API.","tags":["company-management","company-profiles","crm","document-generation","fastapi","internal-tool","internal-tools","spa","sqlite"],"tech":["Docker","fpdf2","FastAPI","aiosqlite","fastapi-users","Python","SQLAlchemy","SQLite","Bootstrap","Alembic","JavaScript"],"category":"Web Apps & Prototypes","live_url":"https://jpeckenpaugh.github.io/ch/","repo_url":"https://github.com/jpeckenpaugh/company-hub","has_live_demo":true,"featured":true,"status":"prototype","confidence":"high","notes":"No homepage, no GitHub Pages, no CNAME, and no live URL in the dossier, so live_url is null. Self-hosted app run via ./run.sh (uvicorn on 127.0.0.1:8000); login required. No license specified. Actively developed through sprints 01-03 as of the last push (2026-09-06). | ch: Live probe returned 200 with title 'Company Hub — Personal workspace'. Written in JavaScript by language stat but is primarily a Python/FastAPI app with a Bootstrap SPA frontend. No license or stars (0).","repos":["company-hub","ch"],"demos":[{"label":"Play","url":"https://jpeckenpaugh.github.io/ch/"}],"thumb":"thumbnails/company-hub.webp","updated_at":"2026-09-07T19:56:28Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":58,"live_final_url":"https://jpeckenpaugh.github.io/ch/","live_error":null},{"key":"driver-hub-prototype","repo":"driver-hub-prototype","display_title":"Driver Hub Prototype","tagline":"Uber-style ride-hailing prototype connecting drivers and passengers in real time","short_description":"A lightweight full-stack prototype of a ride-hailing platform (Uber/Cabify style) that pairs drivers and passengers in real time over an interactive map.","long_description":"Driver Hub Prototype is a functional, modern prototype of a ride-sharing platform connecting Drivers and Passengers in real time. It demonstrates the essential passenger-driver interaction: requesting a trip on an interactive map, real-time notification and acceptance by the driver, visual route tracking, and reactive trip status updates. The interface is designed for side-by-side demos (split screen or two devices). The stack is React 19 + TypeScript + Vite + Tailwind CSS on the frontend, Leaflet / React-Leaflet with OpenStreetMap for maps (no API keys needed), and Node.js + Express + Socket.io for real-time communication across browsers or devices on the same local network. The repository is an npm workspaces monorepo with shared, server, and client packages, and GitHub Pages workflows for deployment.","tags":["maps","prototype","react","real-time","ride-hailing","socket-io"],"tech":["TypeScript","React 19","Vite","Tailwind CSS","Leaflet","React-Leaflet","OpenStreetMap","Node.js","Express","Socket.io","npm workspaces"],"category":"Web Apps & Prototypes","live_url":"https://jpeckenpaugh.github.io/driver-hub-prototype/","repo_url":"https://github.com/jpeckenpaugh/driver-hub-prototype","has_live_demo":true,"featured":true,"status":"prototype","confidence":"high","notes":"Live GitHub Pages probe returned HTTP 200 with title 'Driver Hub Prototype 🚗💨'. Repo has no description, no license, 0 stars. README and docs (ARQUITECTURA.md, ESPECIFICACION_TECNICA.md) are in Spanish. Repo is an npm workspaces monorepo (shared/server/client).","demos":[{"label":"Play","url":"https://jpeckenpaugh.github.io/driver-hub-prototy nd frontend stages, but formal verification has not completed yet.","tags":["fastapi","productivity","single-user","sqlite","task-management","web-app"],"tech":["Python","FastAPI","SQLAlchemy","SQLite","Jinja2","Bootstrap","JavaScript","SQL.js","Uvicorn"],"category":"Web Apps & Prototypes","live_url":"https://jpeckenpaugh.github.io/executive-assistant/","repo_url":"https://github.com/jpeckenpaugh/executive-assistant","has_live_demo":true,"featured":true,"status":"prototype","confidence":"high","notes":"Live GitHub Pages probe returned HTTP 200 with title 'Executive Assistant'. Repo has no description, no GitHub-reported license (README states MIT), and 0 stars. README notes the initial build is complete but formal verification has not finished; known items include reminder visibility on related detail pages and HTTP 422 validation response presentation. The live site appears to be the client-side poc-browser build (sql.js), while the main app is a FastAPI server intended to run locally on localhost:8000.","demos":[{"label":"Play","url":"https://jpeckenpaugh.github.io/executive-assistant/"}],"thumb":"thumbnails/executive-assistant.webp","updated_at":"2026-09-08T05:47:32Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":53,"live_final_url":"https://jpeckenpaugh.github.io/executive-assistant/","live_error":null},{"key":"herons-fountain","repo":"herons-fountain","display_title":"Heron's Fountain — 2D Simulation","tagline":"Interactive browser simulation of a pump-less Heron's fountain","short_description":"An interactive, browser-based 2D approximation of a Heron's fountain that shows how falling water compresses trapped air to drive a fountain jet without a pump.","long_description":"Heron's Fountain is a zero-dependency, browser-based 2D simulation of a Heron's fountain. It models three water regions (a fixed top Basin, sealed Chamber A, and sealed Chamber B) connected by pipes P1, P2, and P3, treating the two sealed air spaces as one shared volume at a single pressure. Physics uses a polytropic pressure-volume relation (P = P0 (V0 / V)^k, default isothermal k = 1) and an orifice flow approximation (Q = Cd A sqrt(2 dP / rho)) accounting for hydrostatic head, with water conserved as transferred volumes. The animated side view draws the apparatus, liquid flow, airflow, and a horizontal particle jet, with live readouts of elapsed time, jet velocity, flow rate, vessel volumes, and fill percentages. Controls include Invert (exchanging chamber elevations and reversing flow), Auto Invert with selectable triggers (jet speed, flow rate, chamber fill, elapsed cycle time, or settled condition) plus threshold and dwell, simulation Speed of 1x-16x, and Reset. It is a deliberate lumped approximation that omits turbulence, surface tension, viscosity, temperature change, and detailed inversion mechanics. No build step or external dependency is required; serve the directory as static files.","tags":["canvas","fluid-dynamics","interactive","physics","simulation"],"tech":["JavaScript","HTML5","Canvas"],"category":"Web Apps & Prototypes","live_url":"https://jpeckenpaugh.github.io/herons-fountain/","repo_url":"https://github.com/jpeckenpaugh/herons-fountain","has_live_demo":true,"featured":true,"status":"prototype","confidence":"high","notes":"Live probe returned HTTP 200 with title \"Heron's Fountain\". No CNAME in the repo, so the jpeckenpaugh.github.io/<repo>/ URL is used. No license declared. Only four files (index.html, physics.js, render.js, README.md) and no build step or dependencies.","demos":[{"label":"Play","url":"https://jpeckenpaugh.github.io/herons-fountain/"}],"thumb":"thumbnails/herons-fountain.webp","updated_at":"2026-08-31T11:34:46Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":54,"live_final_url":"https://jpeckenpaugh.github.io/herons-fountain/","live_error":null},{"key":"oblique-livive-net","repo":"oblique-livive-net","display_title":"Oblique · 2.5D World Sandbox","tagline":"Interactive 2.5D game-world workbench for dynamic Y-depth sorting, procedural terrain layers, and scene composition.","short_description":"A browser-based game workbench for testing sprite depth sorting, 12-angle turntable anchors, procedural 5-layer terrain substrates, and scene event choreography on an orthogonal grid.","long_description":"Oblique is an inspectable browser workbench exploring how layered terrain, water foam, dynamic Y-sorting, and directional silhouette shadows unite on an orthogonal 64×64 grid. Its modular applications include a 2.5D model sandbox with live sprite and anchor editing, solid obstacle collisions, and directional shadow feathering; a 5-layer procedural terrain engine with soloable Worley bedrock, Bayer-dithered turf, and translucent UV wave drift; a 16×16 scene-building Playground with terrain brush painting, sprite scaling, and event sequence scripting; and an atmospheric Beach Camp coastal scene study.","tags":["2.5d","game-assets","game-development","procedural-terrain","sandbox"],"tech":["JavaScript","HTML","CSS","Canvas"],"category":"Web Apps & Prototypes","live_url":"https://oblique.livive.net/","demos":[{"label":"Explore Oblique","url":"https://oblique.livive.net/"},{"label":"2.5D Model Sandbox","url":"https://oblique.livive.net/sandbox.html"},{"label":"Playground Scene Builder","url":"https://oblique.livive.net/playground.html"},{"label":"5-Layer Terrain POC","url":"https://oblique.livive.net/terrain-layers.html"},{"label":"Beach Camp Scene Study","url":"https://oblique.livive.net/beach-camp.html"}],"repo_url":"https://github.com/jpeckenpaugh/oblique-livive-net","has_live_demo":true,"featured":true,"status":"active experiments","confidence":"high","notes":"Repository README describes a browser-based 2.5D game-world workbench with four featured live pages: the model sandbox, the Playground scene builder (playground.html), Terrain Layers, and Beach Camp. Static HTML, CSS, and vanilla JavaScript; GitHub Pages deploys the repository root. The related Sprites model-to-sprite workshop is hosted at sprites.livive.net.","thumb":"thumbnails/oblique-livive-net.webp","updated_at":"2026-10-18T07:09:07.422Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":149,"live_final_url":"https://oblique.livive.net/","live_error":null,"how_to_play":[{"title":"🕹️ 1. Dynamic Y-Sorting & Obstacle Collision","body":"Walk the player character through the 64×64 world using WASD or arrow keys. Watch sprites sort dynamically along the Y-axis as characters weave behind and in front of houses, palms, and docks with directional silhouette shadows."},{"title":"🛠️ 2. Diagnostic Overlays & Live Sprite Editor","body":"Toggle footprint hitboxes, registration crosshairs, cyan bounds, and grid lines. Click any prop to scrub turntable frames (0–11 angles), reposition registration anchors, and tune shadow feathering in real time."},{"title":"🌊 3. Five-Layer Substrate Deconstruction","body":"Explore the procedural terrain engine in Terrain Layers. Use Solo buttons to isolate L1 Bedrock edge rifts, L2 Bayer-dithered retro turf, L3 Sand topsoil, L4 Translucent water & shoreline foam, and L5 2.5D props."},{"title":"🎨 4. Playground Scene Builder & Event Sequencer","body":"Craft 16×16 scenes with terrain brushes, place NPCs with custom orientations and scaling, toggle autonomous wandering, and choreograph story sequences with camera transitions and dialogue boxes."}]},{"key":"robot-motion-studio","repo":"robot-motion-studio","display_title":"Robot Motion Studio","tagline":"Design, simulate, and export PWM servo motion sequences for Arduino robots","short_description":"A web app for designing and managing PWM servo motor control sequences for Arduino-based robots, with configuration, reusable poses, a timeline editor, a Canvas simulator, and structured JSON export.","long_description":"Robot Motion Studio (Robot Servo Sequence Designer) is a local, single-user multi-robot motion designer for PWM servo robots. Users configure servo motors (PWM pin, angle limits, neutral angle, pulse calibration), create reusable poses, author ordered/timed motion sequences through a visual timeline editor (add/reorder/edit/duplicate steps, play/pause/scrub, per-step speed and easing), inspect resolved motion in a preview, watch it in a dependency-free browser Canvas simulator, and export robot-scoped JSON (schema_version 2) for Arduino firmware or other robot-control software. Motion timing supports easing curves, finite/forever sequence repeat, and contiguous step-group loops. A fresh database seeds a door-durability-tester rig (shoulder/elbow/wrist/gripper servos) plus demo robots: PickPlaceArm (6-DOF arm), QuadTrotter (quadruped), BipedWalker (biped), and GimbalCam (pan/tilt). The original edition pairs a FastAPI + SQLite backend with a static Bootstrap 5 SPA (no build toolchain); a browser-only edition replaces the backend with sql.js WebAssembly SQLite running in a Web Worker and OPFS persistence, making it fully static for GitHub Pages. It is a proof-of-concept and does not communicate with physical Arduino hardware or perform real-time control.","tags":["arduino","motion-sequencing","robotics","servo","web-app"],"tech":["JavaScript","Python","FastAPI","SQLite","Bootstrap 5","sql.js","WebAssembly","HTML/CSS"],"category":"Web Apps & Prototypes","live_url":"https://jpeckenpaugh.github.io/robot-motion-studio/","repo_url":"https://github.com/jpeckenpaugh/robot-motion-studio","has_live_demo":true,"featured":true,"status":"prototype","confidence":"high","notes":"Live GitHub Pages probe returned HTTP 200 with title 'Robot Motion Designer (Browser Edition)'. No CNAME in the repo, so the Pages URL jpeckenpaugh.github.io/robot-motion-studio/ is used; .github/workflows/deploy.yml publishes browser-edition/ to GitHub Pages. No repo description, homepage, license, or topics; 0 stars. Self-described proof-of-concept (POC) that does not talk to physical hardware. Two editions: server edition (FastAPI + SQLite + static Bootstrap SPA; pinned deps fastapi==0.115.6, uvicorn[standard]==0.34.0) and static browser edition (sql.js WASM SQLite in a Web Worker, OPFS persistence). Verification reports record v0.1 82/83 pass and Sprint-01 85/86 pass (one known FAIL each: preview staleness, fixed in Sprint 01 as I11/K8; stored step speed not recomputed on mutation as G7).","demos":[{"label":"Play","url":"https://jpeckenpaugh.github.io/robot-motion-studio/"}],"thumb":"thumbnails/robot-motion-studio.webp","updated_at":"2026-09-08T08:38:27Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":71,"live_final_url":"https://jpeckenpaugh.github.io/robot-motion-studio/","live_error":null},{"key":"vid-factory","repo":"vid-factory","display_title":"Video Content Factory","tagline":"Organize video content ideas and draft AI scripts with browser-native TTS","short_description":"A browser-centric web application for organizing early-stage video content ideas, managing catalogs of applications and companies, drafting scripts with client-side AI providers, and synthesizing dialogue with in-browser text-to-speech.","long_description":"Video Content Factory is a web application for organizing early-stage content ideas and drafts. Its primary local runtime is a browser-native standalone application (browser-edition/) that runs entirely client-side with no backend server: a dedicated Web Worker database layer uses vendored sql.js (SQLite compiled to WebAssembly) with persistence in the Origin Private File System (OPFS), communicating through an RPC message-passing protocol between the UI (app.js) and db-worker.js. It manages catalogs for applications (YouTube, TikTok, Instagram) and companies (Acme Studio, Northstar Media, Pine & Peak), content projects with optional application/company links, and one persisted script/prompt draft per project. Workspace settings store AI provider credentials (Gemini, OpenAI, Ollama) in a local SQLite ai_settings table with custom endpoint URLs and connectivity tests; API keys are stripped during export. A client-side AI script generator formulates formatted drafts from user prompts and confirms before overwriting manual drafts. A dedicated TTS worker (tts-worker.js) runs kokoro-js speech synthesis in WebAssembly/WebGPU, exposing voice selection (af_heart, af_bella, am_adam, am_michael), a 0.75x-1.25x speed slider, an inline HTML5 audio preview player, and local audio track persistence with metadata (voice_id, speed, script_snapshot, duration). Workspaces are portable via JSON export/import with structural validation and seed reset. The original FastAPI JSON API and Bootstrap browser UI (backend/ and frontend/, pinned fastapi==0.115.12 and uvicorn[standard]==0.34.0) remain available unchanged as a parity reference and fallback runtime, serving a seeded local SQLite database (backend/data/vid_factory.db). Multi-speaker timeline synchronization, cloud rendering pipelines, server-side audio processing, and cloud sync are explicitly deferred. Status: Sprint 02 complete (client-side AI & dialogue TTS), verified pass with sandbox environment limitations.","tags":["ai-script-generation","content-creation","sqlite","text-to-speech","video","web-app"],"tech":["JavaScript","Python","FastAPI","SQLite","sql.js","WebAssembly","kokoro-js","OPFS","WebGPU","Bootstrap 5","HTML/CSS"],"category":"Web Apps & Prototypes","live_url":"https://jpeckenpaugh.github.io/vid-factory/","repo_url":"https://github.com/jpeckenpaugh/vid-factory","has_live_demo":true,"featured":true,"status":"prototype","confidence":"high","notes":"Live GitHub Pages probe returned HTTP 200 with title 'Video Content Factory — Browser Workspace'. No CNAME found in the repo, so the Pages URL jpeckenpaugh.github.io/vid-factory/ is used; .github/workflows/deploy.yml publishes to GitHub Pages. No repo description, homepage, license, or topics; 1 star. Two runtimes: browser-native primary edition (sql.js WASM SQLite in a Web Worker, OPFS persistence, kokoro-js TTS, client-side Gemini/OpenAI/Ollama script generation) and an unchanged FastAPI + Bootstrap fallback reference. Sprint 02 verification result: Pass with sandbox environment limitations (kokoro-js execution and OPFS audio persistence verified only via static review because headless browser/WebGPU was unavailable; ./run.sh reload watcher failed under sandbox restrictions).","demos":[{"label":"Play","url":"https://jpeckenpaugh.github.io/vid-factory/"}],"thumb":"thumbnails/vid-factory.webp","updated_at":"2026-09-08T17:49:59Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":59,"live_final_url":"https://jpeckenpaugh.github.io/vid-factory/","live_error":null},{"key":"tech-livive-net","repo":"tech-livive-net","display_title":"tech.livive.net","tagline":"Zero-framework static publication notebook exploring hardware architecture, silicon teardowns, and multi-agent AI personas.","short_description":"A handcrafted, zero-build technical notebook rendering 34 in-depth hardware essays, interactive teardown schematics, and 5 specialized AI editorial personas with vanilla JS and Pico.css.","long_description":"tech.livive.net is an inspectable static publication notebook built with a strict zero-framework, zero-build-step philosophy. Powered by plain HTML, classless Pico.css, and client-side hash routing in vanilla JavaScript, it renders 34 deep technical essays across maker hardware, wearable acoustics, smart-home IoT, and modular computing. Each essay includes inspectable SVG schematics, PCB bus routing rules, and primary source citations. Its masthead introduces a multi-agent AI editorial board where 5 distinct personas (Forge, Ledger, Hearth, Timbre, and Compass) operate with transparent engineering beats, behavioral traits, and lab bench toolkits.","tags":["blog","github-pages","no-build","static-site","vanilla-javascript"],"tech":["HTML","CSS","JavaScript",     const REMOTE_ASSET_BASE = "https://www.livive.net/";
    const WEEK_MS = 7 * 24 * 60 * 60 * 1000;

    function resolveAsset(pathStr, isVideo = false) {
      if (!pathStr) return "";
      if (/^https?:\/\//i.test(pathStr)) return pathStr;
      const clean = pathStr.replace(/^\/+/, "");
      // Local thumbnails/ exist in repo; fallback to www.livive.net for local previews/*.webm
      if (isVideo && clean.startsWith("previews/")) {
        return REMOTE_ASSET_BASE + clean;
      }
      return clean;
    }

    function projectGradient(key, idx = 0) {
      let hash = 0;
      for (const ch of String(key)) hash = (hash * 31 + ch.charCodeAt(0)) % 360;
      const h1 = (hash + idx * 37) % 360;
      const h2 = (h1 + 52) % 360;
      const h3 = (h1 + 205) % 360;
      return `linear-gradient(135deg, hsl(${h1}, 72%, 26%) 0%, hsl(${h2}, 78%, 36%) 55%, hsl(${h3}, 68%, 15%) 100%)`;
    }

    function safeDate(s) {
      const t = Date.parse(s || "");
      return Number.isFinite(t) ? t : 0;
    }

    function isNew(p) {
      const t = safeDate(p.updated_at);
      return t > 0 && (Date.now() - t) < WEEK_MS;
    }

    function relDate(s) {
      const t = safeDate(s);
      if (!t) return "recently";
      const days = Math.round((Date.now() - t) / 86400000);
      if (days <= 0) return "today";
      if (days === 1) return "yesterday";
      if (days < 7) return `${days}d ago`;
      if (days < 30) return `${Math.round(days / 7)}w ago`;
      if (days < 365) return `${Math.round(days / 30)}mo ago`;
      return `${Math.round(days / 365)}y ago`;
    }

    const projects = INITIAL_PROJECTS.projects.map((p, idx) => {
      const pv = INITIAL_PREVIEWS[p.key] || null;
      const videoUrl = pv && pv.video ? resolveAsset(pv.video, true) : "";
      const posterUrl = p.thumb ? resolveAsset(p.thumb, false) : (pv && pv.poster ? resolveAsset(pv.poster, false) : "");
      const gallery = (pv && Array.isArray(pv.gallery)) ? pv.gallery : [];
      const durationSec = pv && pv.duration_ms ? Math.round(pv.duration_ms / 1000) : null;
      const isShowcase = pv && pv.mode === "demo";

      return {
        ...p,

        videoUrl,
        posterUrl,
        gallery,
        durationSec,
