      const featured = [
        ...(gp ? [gp] : []),
        ...projects.filter(p => p.key !== "game-pending" && p.featured && p.has_live_demo)
      ];

      const rails = [
        {
          title: "Featured Showcases & Originals",
          sub: "Flagship interactive builds & playable originals",
          items: featured.slice(0, 12)
        },
        {
          title: "Recently Updated",
          sub: "Latest commits & deployments first",
          items: byUpdated.slice(0, 12)
        },
        {
          title: "Playable Right Now",
          sub: "Instant browser launch",
          items: projects.filter(p => p.has_live_demo)
        }
      ];

      for (const cat of INITIAL_PROJECTS.category_order) {
        const items = projects.filter(p => p.category === cat);
        if (items.length) {
          rails.push({
            title: cat,
            sub: `${items.filter(i => i.has_live_demo).length} playable · ${items.length} total`,
            items
          });
        }
      }

      return rails;
    }

    function renderRails() {
      categoriesContainer.innerHTML = "";
      const rails = buildRails();

      rails.forEach((rail) => {
        if (!rail.items.length) return;
        const section = document.createElement("section");
        section.className = "category-row";

        section.innerHTML = `
          <div class="category-header">
            <h2 class="category-title">${rail.title}</h2>
            ${rail.sub ? `<span class="category-sub">${rail.sub}</span>` : ""}
          </div>
          <div class="carousel-viewport">
            <button class="carousel-nav prev" type="button" aria-label="Scroll Left">&#10094;</button>
            <div class="carousel-track"></div>
            <button class="carousel-nav next" type="button" aria-label="Scroll Right">&#10095;</button>
          </div>
        `;

        const track = section.querySelector(".carousel-track");

        rail.items.forEach((item) => {
          const card = document.createElement("div");
          card.className = "card-item";

          const topBadge = item.isShowcase
            ? `<div class="card-top10">TOP<br>PICK</div>`
            : (isNew(item) ? `<div class="card-top10">NEW</div>` : "");

          let ribbonHTML = "";
          if (item.isShowcase) {
            ribbonHTML = `<div class="card-ribbon"><span class="ribbon-red">Featured</span><span class="ribbon-white">Play Now</span></div>`;
          } else if (item.has_live_demo) {
            ribbonHTML = `<div class="card-ribbon"><span class="ribbon-red">Playable Now</span></div>`;
          }

          const imgHTML = item.posterUrl
            ? `<img loading="lazy" src="${item.posterUrl}" alt="${item.display_title}" />`
            : "";

          const statusPill = item.has_live_demo
            ? `<span class="card-live-dot"><span class="live-dot"></span>Live</span>`
            : `<span class="card-live-dot">Repo</span>`;

          card.innerHTML = `
            <div class="card-thumb" style="background: ${item.gradient};">
              ${imgHTML}
              ${topBadge}
              ${statusPill}
              <div class="card-title-art">${item.display_title}</div>
              ${ribbonHTML}
            </div>
          `;

          card.addEventListener("mouseenter", () => scheduleHoverCard(item, card));
          card.addEventListener("mouseleave", () => scheduleHideHoverCard());
          card.addEventListener("click", () => openDetailModal(item));

          track.appendChild(card);
        });

        const prevBtn = section.querySelector(".carousel-nav.prev");
        const nextBtn = section.querySelector(".carousel-nav.next");
        prevBtn.addEventListener("click", () => {
          track.scrollBy({ left: -track.clientWidth * 0.78, behavior: "smooth" });
        });
        nextBtn.addEventListener("click", () => {
          track.scrollBy({ left: track.clientWidth * 0.78, behavior: "smooth" });
        });

        categoriesContainer.appendChild(section);
      });
    }

    renderRails();

    // Navbar filter buttons
    document.querySelectorAll("#nav-links button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#nav-links button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter || "all";
        searchQuery = "";
        document.getElementById("search-input").value = "";
        renderRails();
      });
    });

    document.getElementById("brand-home").addEventListener("click", (e) => {
      e.preventDefault();
      activeFilter = "all";
      searchQuery = "";
      document.getElementById("search-input").value = "";
      document.querySelectorAll("#nav-links button").forEach((b, i) => b.classList.toggle("active", i === 0));
      closeDetailModal();
      renderRails();
    });

    document.getElementById("search-input").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderRails();
    });

    // ==================== 3. HOVER MINI-MODAL LOGIC (03.png) ====================
    const hoverCard = document.getElementById("hover-card");
    const hoverMedia = document.getElementById("hover-card-media");
    const hoverImg = document.getElementById("hover-card-img");
    const hoverVideo = document.getElementById("hover-card-video");
    const hoverTitle = document.getElementById("hover-card-title");
    const hoverSubtitle = document.getElementById("hover-card-subtitle");
    const hoverPlayBtn = document.getElementById("hover-play-btn");
    const hoverRepoBtn = document.getElementById("hover-repo-btn");
    const hoverMetaRow = document.getElementById("hover-meta-row");
    const hoverTags = document.getElementById("hover-tags");

    let activeHoverItem = null;
    let hoverShowTimer = null;
    let hoverHideTimer = null;

    function scheduleHoverCard(item, anchorEl) {
      clearTimeout(hoverHideTimer);
      clearTimeout(hoverShowTimer);
      hoverShowTimer = setTimeout(() => {
        showHoverCard(item, anchorEl);
      }, 220);
    }

    function scheduleHideHoverCard() {
      clearTimeout(hoverShowTimer);
      hoverHideTimer = setTimeout(() => {
        hideHoverCard();
      }, 150);
    }

    function hideHoverCard() {
      hoverCard.classList.remove("visible");
      hoverVideo.pause();
      hoverVideo.removeAttribute("src");
    }

    function showHoverCard(item, anchorEl) {
      activeHoverItem = item;
      const rect = anchorEl.getBoundingClientRect();

      hoverMedia.style.background = item.gradient;
      if (item.posterUrl) {
        hoverImg.src = item.posterUrl;
        hoverImg.style.display = "block";
      } else {
        hoverImg.style.display = "none";
      }

      if (item.videoUrl) {
        hoverVideo.src = item.videoUrl;
        hoverVideo.poster = item.posterUrl || "";
        hoverVideo.style.display = "block";
        hoverVideo.play().catch(() => {});
      } else {
        hoverVideo.pause();
        hoverVideo.removeAttribute("src");
        hoverVideo.style.display = "none";
      }

      hoverTitle.textContent = item.display_title;
      hoverSubtitle.textContent = item.tagline || item.short_description || "";
      hoverPlayBtn.href = item.primaryUrl;
      hoverRepoBtn.href = item.repo_url || "#";

      const durBadge = item.isShowcase
        ? `<span>Featured Gameplay</span>`
        : `<span>Updated ${relDate(item.updated_at)}</span>`;

      hoverMetaRow.innerHTML = `
        <span>${item.category}</span>
        <span class="badge-box ${item.has_live_demo ? "live" : ""}">${item.has_live_demo ? "PLAYABLE" : "REPO"}</span>
        ${durBadge}
        <span class="badge-box">HD</span>
      `;

      const topTech = (item.tech && item.tech.length) ? item.tech.slice(0, 3) : (item.tags || []).slice(0, 3);
      hoverTags.innerHTML = topTech
        .map((t, idx) => idx === 0 ? `<span>${t}</span>` : `<span class="dot">•</span><span>${t}</span>`)
        .join("");

      const cardWidth = 340;
      const cardHeight = 315;

      let left = rect.left + (rect.width / 2) - (cardWidth / 2);
      left = Math.max(20, Math.min(window.innerWidth - cardWidth - 20, left));

      let top = rect.top + (rect.height / 2) - (cardHeight / 2);
      top = Math.max(68, Math.min(window.innerHeight - cardHeight - 16, top));

      hoverCard.style.left = `${left}px`;
      hoverCard.style.top = `${top}px`;
      hoverCard.classList.add("visible");
    }

    hoverCard.addEventListener("mouseenter", () => clearTimeout(hoverHideTimer));
    hoverCard.addEventListener("mouseleave", () => scheduleHideHoverCard());

    hoverMedia.addEventListener("click", () => {
      if (activeHoverItem) openDetailModal(activeHoverItem);
    });

    document.getElementById("hover-expand-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      if (activeHoverItem) openDetailModal(activeHoverItem);
    });

    document.getElementById("hover-pin-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      if (activeHoverItem) {
        renderHero(activeHoverItem);
        hideHoverCard();
        window.scrollTo({ top: 0, behavior: "smooth" });
        showToast(`★ Featured "${activeHoverItem.display_title}" in Hero Billboard`);
      }
    });

    window.addEventListener("scroll", () => {
      clearTimeout(hoverShowTimer);
      if (hoverCard.classList.contains("visible")) hideHoverCard();
    }, { passive: true });

    // ==================== 4. DETAILED TITLE MODAL LOGIC (04.png) ====================
    const modalBackdrop = document.getElementById("modal-backdrop");
    const modalHero = document.getElementById("modal-hero");
    const modalHeroMedia = document.getElementById("modal-hero-media");
    const modalSlideBadge = document.getElementById("modal-slide-badge");
    const modalTitle = document.getElementById("modal-title");
    const modalSubtitle = document.getElementById("modal-subtitle");
    const modalPlayBtn = document.getElementById("modal-play-btn");
    const modalPlayLabel = document.getElementById("modal-play-label");
    const modalRepoBtn = document.getElementById("modal-repo-btn");
    const modalSpecs = document.getElementById("modal-specs");
    const modalHeadline = document.getElementById("modal-headline");
    const modalSynopsis = document.getElementById("modal-synopsis");
    const modalCategory = document.getElementById("modal-category");
    const modalTech = document.getElementById("modal-tech");
    const modalTags = document.getElementById("modal-tags");
    const modalLinks = document.getElementById("modal-links");
    const modalHowtoSection = document.getElementById("modal-howto-section");
    const modalHowtoGrid = document.getElementById("modal-howto-grid");
    const moreGrid = document.getElementById("more-grid");

    let currentModalItem = null;
    let modalSlides = [];
    let currentSlideIdx = 0;

    function buildModalSlides(item) {
      const slides = [];
      if (item.videoUrl) {
        slides.push({
          kind: "video",
          src: item.videoUrl,
          poster: item.posterUrl || "",
          label: item.isShowcase ? "Live Gameplay Reel" : "Live Preview Clip",
          badge: "GAMEPLAY"
        });
      }
      if (item.gallery && item.gallery.length) {
        item.gallery.forEach((g, idx) => {
          slides.push({
            kind: "image",
            src: resolveAsset(g.src, false),
            label: g.label || `Screenshot ${idx + 1}`,
            badge: `${String(idx + 1).padStart(2, "0")} / ${String(item.gallery.length).padStart(2, "0")}`
          });
        });
      } else if (item.posterUrl && !slides.length) {
        slides.push({
          kind: "image",
          src: item.posterUrl,
          label: item.display_title,
          badge: "POSTER"
        });
      }
      return slides;
    }

    function renderModalSlide(idx) {
      if (!modalSlides.length) {
        modalHeroMedia.innerHTML = "";
        modalSlideBadge.style.display = "none";
        return;
      }
      currentSlideIdx = (idx + modalSlides.length) % modalSlides.length;
      const slide = modalSlides[currentSlideIdx];
      modalSlideBadge.style.display = "inline-block";
      modalSlideBadge.textContent = `${slide.badge} · ${slide.label}`;

      if (slide.kind === "video") {
        modalHeroMedia.innerHTML = `
          <video src="${slide.src}" poster="${slide.poster}" muted autoplay loop playsinline class="${currentModalItem.isShowcase ? "" : "cover-mode"}"></video>
        `;
      } else {
        modalHeroMedia.innerHTML = `
          <img src="${slide.src}" alt="${slide.label}" class="${currentModalItem.isShowcase ? "" : "cover-mode"}" />
        `;
      }
    }

    function openDetailModal(item, updateHash = true) {
      currentModalItem = item;
      hideHoverCard();

      modalHero.style.background = item.gradient;
      modalSlides = buildModalSlides(item);
      modalHero.classList.toggle("has-gallery", modalSlides.length > 1);
      renderModalSlide(0);

      modalTitle.textContent = item.display_title;
      modalSubtitle.textContent = item.tagline || "";
      modalPlayBtn.href = item.primaryUrl;
      modalPlayLabel.textContent = item.has_live_demo ? "Play Live" : "Open Repo";
      modalRepoBtn.href = item.repo_url || "#";

      modalSpecs.innerHTML = `
        <span>Updated ${relDate(item.updated_at)}</span>
        <span class="badge-box ${item.has_live_demo ? "live" : ""}">${item.has_live_demo ? "PLAYABLE" : "SOURCE"}</span>
        ${item.status ? `<span class="badge-box">${item.status}</span>` : ""}
        <span class="badge-box">720p HD</span>
      `;

      modalHeadline.textContent = item.tagline || item.display_title;
      modalSynopsis.textContent = item.long_description || item.short_description || item.tagline || "";
      modalCategory.textContent = item.category;
      modalTech.textContent = (item.tech && item.tech.length) ? item.tech.join(", ") : "Standard Web Stack";
      modalTags.textContent = (item.tags && item.tags.length) ? item.tags.join(", ") : item.category;

      const linkParts = [];
      if (item.live_url) linkParts.push(`<a href="${item.live_url}" target="_blank" rel="noopener noreferrer">Play Live App ↗</a>`);
      if (item.repo_url) linkParts.push(`<a href="${item.repo_url}" target="_blank" rel="noopener noreferrer">GitHub Repo &amp; Source ↗</a>`);
      modalLinks.innerHTML = linkParts.join(" · ");

      // Populate How to Play section if available
      if (Array.isArray(item.how_to_play) && item.how_to_play.length) {
        modalHowtoSection.style.display = "block";
        modalHowtoGrid.innerHTML = item.how_to_play
          .map(card => `
            <div class="howto-card">
              <h4>${card.title}</h4>
              <p>${card.body}</p>
            </div>
          `)
          .join("");
      } else {
        modalHowtoSection.style.display = "none";
        modalHowtoGrid.innerHTML = "";
      }

      // Populate "More Like This"
      const related = projects
        .filter(x => x.key !== item.key)
        .map(x => {
          let score = 0;
          if (x.category === item.category) score += 3;
          score += (x.tags || []).filter(t => (item.tags || []).includes(t)).length * 2;
          score += (x.tech || []).filter(t => (item.tech || []).includes(t)).length;
          return { x, score };
        })
        .sort((a, b) => b.score - a.score)
        .slice(0, 6)
        .map(o => o.x);

      moreGrid.innerHTML = "";
      related.forEach((rel) => {
        const card = document.createElement("div");
        card.className = "more-card";
        const imgHTML = rel.posterUrl ? `<img loading="lazy" src="${rel.posterUrl}" alt="${rel.display_title}" />` : "";
        card.innerHTML = `
          <div class="more-card-art" style="background: ${rel.gradient};">
            ${imgHTML}
            <span class="more-card-runtime">${rel.has_live_demo ? "Playable" : "Repo"}</span>
            <div class="more-card-title">${rel.display_title}</div>
          </div>
          <div class="more-card-desc">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
              <span class="badge-box ${rel.has_live_demo ? "live" : ""}">${rel.category}</span>
              <span style="margin-left:auto;color:#888;font-size:11.5px;">${relDate(rel.updated_at)}</span>
            </div>
            ${rel.short_description || rel.tagline || ""}
          </div>
        `;
        card.addEventListener("click", () => {
          openDetailModal(rel);
          modalBackdrop.scrollTo({ top: 0, behavior: "smooth" });
        });
        moreGrid.appendChild(card);
      });

      modalBackdrop.classList.add("open");
      document.body.classList.add("modal-open");
      if (updateHash) {
        history.replaceState(null, "", `#project=${encodeURIComponent(item.key)}`);
      }
    }

    function closeDetailModal() {
      modalBackdrop.classList.remove("open");
      document.body.classList.remove("modal-open");
      modalHeroMedia.innerHTML = "";
      if (location.hash.startsWith("#project=")) {
        history.replaceState(null, "", location.pathname + location.search);
      }
    }

    document.getElementById("modal-slide-prev").addEventListener("click", () => renderModalSlide(currentSlideIdx - 1));
    document.getElementById("modal-slide-next").addEventListener("click", () => renderModalSlide(currentSlideIdx + 1));
    document.getElementById("modal-close-btn").addEventListener("click", closeDetailModal);
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) closeDetailModal();
    });

    document.getElementById("modal-pin-btn").addEventListener("click", () => {
      if (currentModalItem) {
        renderHero(currentModalItem);
        closeDetailModal();
        window.scrollTo({ top: 0, behavior: "smooth" });
        showToast(`★ Featured "${currentModalItem.display_title}" in Hero Billboard`);
      }
    });

    window.addEventListener("keydown", (e) => {
      if (!modalBackdrop.classList.contains("open")) return;
      if (e.key === "Escape") closeDetailModal();
      if (e.key === "ArrowLeft" && modalSlides.length > 1) renderModalSlide(currentSlideIdx - 1);
      if (e.key === "ArrowRight" && modalSlides.length > 1) renderModalSlide(currentSlideIdx + 1);
    });

    // Open modal automatically if URL has #project=<key>
    function checkInitialHash() {
      const m = location.hash.match(/^#project=(.+)$/);
      if (m) {
        const key = decodeURIComponent(m[1]);
        const found = projects.find(p => p.key.toLowerCase() === key.toLowerCase());
        if (found) openDetailModal(found, false);
      }
    }
    window.addEventListener("hashchange", checkInitialHash);
    checkInitialHash();

    // ==================== TOAST HELPER ====================
    const toastEl = document.getElementById("toast");
    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove("show");
      }, 2200);
    }
  </script>
</body>
</html>
