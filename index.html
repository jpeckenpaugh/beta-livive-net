<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <title>Livive — Projects to Stream</title>
  <meta name="description" content="A Netflix-style interactive portfolio of games, AI/ML experiments, language tools, and browser prototypes by Jarad Peckenpaugh." />
  <style>
    :root {
      --bg-main: #0f0f0f;
      --bg-elevated: #181818;
      --bg-card-panel: #181818;
      --text-primary: #ffffff;
      --text-secondary: #bcbcbc;
      --text-muted: #808080;
      --netflix-red: #e50914;
      --live-green: #46d369;
      --border-subtle: rgba(255, 255, 255, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      padding-bottom: 90px;
      user-select: none;
    }

    body.modal-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ==================== TOP NAVIGATION (01.png - 04.png) ==================== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 48px;
      background: linear-gradient(180deg, rgba(0,0,0,0.92) 0%, rgba(15,15,15,0.94) 100%);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 20px;
      min-width: 0;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--netflix-red);
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-right: 6px;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      cursor: pointer;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--netflix-red);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 12px rgba(229, 9, 20, 0.5);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      list-style: none;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav-links::-webkit-scrollbar {
      display: none;
    }

    .nav-links button {
      background: transparent;
      border: 1px solid transparent;
      color: #e5e5e5;
      font: inherit;
      font-size: 13.5px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.18s, color 0.18s, border-color 0.18s;
    }

    .nav-links button:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-links button.active {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-weight: 600;
    }

    .nav-links button.outlined {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      color: #bcbcbc;
      pointer-events: none;
    }

    .search-input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font: inherit;
      font-size: 13.5px;
      padding: 7px 14px 7px 36px;
      border-radius: 999px;
      width: 230px;
      transition: width 0.22s ease, background 0.2s, border-color 0.2s;
    }

    .search-input::placeholder {
      color: #9a9a9a;
    }

    .search-input:focus {
      outline: none;
      width: 280px;
      background: rgba(0, 0, 0, 0.75);
      border-color: rgba(255, 255, 255, 0.65);
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      font-weight: 600;
      color: #e5e5e5;
      background: rgba(70, 211, 105, 0.12);
      border: 1px solid rgba(70, 211, 105, 0.3);
      padding: 5px 11px;
      border-radius: 999px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--live-green);
      box-shadow: 0 0 8px var(--live-green);
    }

    .profile-menu {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #e5e5e5;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
    }

    /* ==================== 1. HERO BILLBOARD (01.png) ==================== */
    .hero-wrapper {
      padding: 8px 48px 30px;
    }

    .hero-billboard {
      position: relative;
      width: 100%;
      height: clamp(440px, 68vh, 670px);
      border-radius: 18px;
      overflow: hidden;
      background: #050507;
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 44px;
    }

    .hero-media-wrap {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .hero-poster,
    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
    }

    .hero-video {
      z-index: 1;
    }

    .hero-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        radial-gradient(circle at 72% 32%, rgba(0,0,0,0.04) 0%, rgba(0,0,0,0.55) 75%),
        linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.25) 50%, rgba(10,10,12,0.95) 100%),
        linear-gradient(90deg, rgba(8,8,10,0.92) 0%, rgba(8,8,10,0.58) 45%, rgba(8,8,10,0.12) 100%);
    }

    .hero-top-left {
      position: absolute;
      top: 28px;
      left: 34px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hero-n-badge {
      color: var(--netflix-red);
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.8);
    }

    .hero-series-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #dcdcdc;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .hero-top-right {
      position: absolute;
      top: 28px;
      right: 34px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hero-icon-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(24, 24, 24, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.38);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.15s, transform 0.15s, border-color 0.15s;
    }

    .hero-icon-circle:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: #fff;
      transform: scale(1.06);
    }

    .hero-content {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      width: 100%;
    }

    .hero-left {
      max-width: 620px;
    }

    .hero-title {
      font-size: clamp(40px, 5.5vw, 72px);
      font-weight: 900;
      line-height: 0.94;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
      text-shadow: 0 6px 26px rgba(0,0,0,0.85);
    }

    .hero-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #f2f2f2;
      margin-bottom: 12px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .hero-tagline {
      font-size: 16px;
      line-height: 1.45;
      color: #dedede;
      margin-bottom: 22px;
      max-width: 56ch;
      text-shadow: 0 2px 10px rgba(0,0,0,0.85);
    }

    .dot {
      color: rgba(255, 255, 255, 0.45);
    }

    .hero-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 26px;
      border-radius: 999px;
      font-size: 15.5px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn-pill:hover {
      transform: scale(1.03);
    }

    .btn-play {
      background: #ffffff;
      color: #000000;
    }

    .btn-play:hover {
      background: rgba(255, 255, 255, 0.86);
    }

    .btn-more {
      background: rgba(109, 109, 110, 0.6);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(6px);
    }

    .btn-more:hover {
      background: rgba(109, 109, 110, 0.8);
    }

    .hero-right-pills {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .promo-pill {
      background: rgba(16, 16, 18, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(6px);
    }

    /* ==================== 2. CATEGORY CAROUSELS (02.png) ==================== */
    .categories-container {
      display: flex;
      flex-direction: column;
      gap: 34px;
    }

    .category-row {
      position: relative;
      padding: 0 48px;
    }

    .category-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
    }

    .category-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #f3f3f3;
    }

    .category-sub {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .carousel-viewport {
      position: relative;
    }

    .carousel-track {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
      padding: 6px 0 14px;
    }

    .carousel-track::-webkit-scrollbar {
      display: none;
    }

    .carousel-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-55%);
      z-index: 15;
      width: 32px;
      height: 58px;
      border-radius: 6px;
      background: rgba(20, 28, 40, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s;
    }

    .category-row:hover .carousel-nav {
      opacity: 1;
    }

    .carousel-nav:hover {
      background: rgba(35, 48, 68, 0.96);
    }

    .carousel-nav.prev {
      left: -12px;
    }

    .carousel-nav.next {
      right: -12px;
    }

    /* Clean 16:9 Thumbnail Card (02.png) */
    .card-item {
      position: relative;
      flex: 0 0 calc((100% - 50px) / 6);
      min-width: 225px;
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      cursor: pointer;
    }

    .card-thumb {
      width: 100%;
      height: 100%;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px 14px;
      background: #1a1a20;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card-thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      z-index: 0;
      transition: transform 0.3s ease;
    }

    .card-thumb::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.12) 45%, rgba(0,0,0,0.84) 100%);
    }

    .card-top10 {
      position: absolute;
      top: 0;
      left: 0;
      background: var(--netflix-red);
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      line-height: 1.05;
      padding: 4px 6px;
      border-bottom-right-radius: 4px;
      text-align: center;
      z-index: 3;
      letter-spacing: 0.4px;
    }

    .card-live-dot {
      position: absolute;
      top: 9px;
      right: 10px;
      z-index: 3;
      background: rgba(15, 15, 18, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e5e5e5;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      backdrop-filter: blur(4px);
    }

    .card-title-art {
      position: relative;
      z-index: 2;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.3px;
      line-height: 1.15;
      text-shadow: 0 2px 10px rgba(0,0,0,0.95);
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-ribbon {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: inline-flex;
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
      overflow: hidden;
      font-size: 10.5px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.45);
    }

    .ribbon-red {
      background: var(--netflix-red);
      color: #fff;
      padding: 2.5px 8px;
    }

    .ribbon-white {
      background: #ffffff;
      color: #000;
      padding: 2.5px 8px;
    }

    /* ==================== 3. HOVER MINI-MODAL (BOB CARD - 03.png) ==================== */
    .hover-card {
      position: fixed;
      z-index: 250;
      width: 340px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-card-panel);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255,255,255,0.14);
      pointer-events: auto;
      opacity: 0;
      transform: scale(0.84);
      transition: opacity 0.18s ease, transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: none;
    }

    .hover-card.visible {
      display: block;
      opacity: 1;
      transform: scale(1);
    }

    .hover-card-media {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      background: #0b0b0e;
      overflow: hidden;
    }

    .hover-card-media img,
    .hover-card-media video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .hover-card-media video {
      z-index: 1;
    }

    .hover-card-media::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(180deg, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0.05) 45%, rgba(18,18,18,0.92) 100%);
    }

    .hover-card-top {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .hover-card-title {
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.95);
    }

    .hover-card-subtitle {
      position: relative;
      z-index: 3;
      text-align: center;
      font-size: 11.5px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.98), 0 0 10px rgba(0,0,0,0.9);
      line-height: 1.35;
      margin-top: auto;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hover-card-body {
      padding: 14px 16px 16px;
      background: #181818;
    }

    .hover-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .hover-controls-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      background: rgba(42, 42, 42, 0.75);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
    }

    .circle-btn:hover {
      border-color: #fff;
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.06);
    }

    .circle-btn.play-solid {
      background: #ffffff;
      border-color: #ffffff;
      color: #000000;
    }

    .circle-btn.play-solid:hover {
      background: rgba(255, 255, 255, 0.85);
    }

    .hover-meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12.5px;
      color: #bcbcbc;
      margin-bottom: 9px;
      font-weight: 600;
    }

    .badge-box {
      border: 1px solid rgba(255, 255, 255, 0.45);
      padding: 0px 5px;
      font-size: 10.5px;
      line-height: 1.45;
      border-radius: 3px;
      color: #e5e5e5;
      text-transform: uppercase;
    }

    .badge-box.live {
      border-color: rgba(70, 211, 105, 0.6);
      color: var(--live-green);
      background: rgba(70, 211, 105, 0.1);
    }

    .hover-tags {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12.5px;
      color: #e5e5e5;
      font-weight: 500;
    }

    /* ==================== 4. DETAILED TITLE MODAL (04.png) ==================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 400;
      background: rgba(0, 0, 0, 0.76);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
      padding: 36px 20px 60px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .detail-modal {
      width: 100%;
      max-width: 880px;
      background: #181818;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      animation: modalPop 0.22s ease-out;
    }

    @keyframes modalPop {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(12px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-hero {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 380px;
      background: #000;
      padding: 34px 42px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }

    .modal-hero-media {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .modal-hero-media img,
    .modal-hero-media video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #050507;
    }

    .modal-hero-media img.cover-mode,
    .modal-hero-media video.cover-mode {
      object-fit: cover;
    }

    .modal-hero-media::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(24,24,24,0.15) 0%, rgba(24,24,24,0.15) 52%, #181818 100%),

rules constant isolates three radically different software architectures: Act I (Vibe TTT: $0.15 client-side DOM baseline), Act II (Fast TTT: zero-frontend curl + ASCII server), and Act III (P2P TTT: zero-backend WebRTC + WASM SQLite)."}]},{"key":"rag-poc","repo":"rag-poc","display_title":"Northstar RAG POC","tagline":"Zero-backend, fully client-side browser RAG with local embeddings and WebGPU LLMs","short_description":"A 100% client-side Retrieval-Augmented Generation proof-of-concept that parses PDFs, chunks text, generates ONNX embeddings, builds an in-memory vector index, and runs local WebGPU language models entirely in the browser with no backend or external APIs.","long_description":"Northstar RAG POC is a static single-page application demonstrating retrieval-augmented generation entirely inside the browser with zero backend and zero external API calls. It extracts per-page text from PDFs using PDF.js, splits documents with a sliding-window chunker, generates embeddings via Transformers.js ONNX models, and stores 367 chunk vectors as contiguous Float32Array buffers in JavaScript heap memory for linear dot-product similarity search. Answers are generated by WebLLM with WebGPU acceleration, hot-swapping between Llama-3.2-1B, SmolLM2-1.7B, Qwen2.5-0.5B, and Qwen2.5-1.5B, or by four ONNX embedding models. When WebGPU is unavailable it falls back to a semantic retrieval view showing ranked matches and cosine scores. The demo is preloaded with 21 fictional Northstar Urgent Care Cooperative operational policy PDFs (64 pages) plus a 15-query evaluation benchmark including guardrail abstention cases. Built-in developer tools include a canvas PDF viewer, chunk visualizer, vector math inspector, raw prompt preview, and hardware diagnostics. It is hosted on GitHub Pages as a fully static bundle.","tags":["browser","embeddings","llm","on-device","rag","vector-search"],"tech":["TypeScript","React","Vite","Tailwind CSS","Transformers.js","WebLLM","PDF.js","WebGPU"],"category":"AI/ML Experiments","live_url":"https://jpeckenpaugh.github.io/rag-poc/","repo_url":"https://github.com/jpeckenpaugh/rag-poc","has_live_demo":true,"featured":true,"status":"prototype","confidence":"high","notes":"Live probe returns HTTP 200 with title 'Northstar RAG POC'; no CNAME found so used the GitHub Pages URL. Self-described proof-of-concept; status set to prototype. Featured because it has a working live demo. All corpus organizations, people, and policies are fictional.","demos":[{"label":"Play","url":"https://jpeckenpaugh.github.io/rag-poc/"}],"thumb":"thumbnails/rag-poc.webp","updated_at":"2026-10-08T20:55:49Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":55,"live_final_url":"https://jpeckenpaugh.github.io/rag-poc/","live_error":null},{"key":"sm3","repo":"sm3","display_title":"State Machine 3","tagline":"DB-driven state machine engine for agentic sprint orchestration & metalevel archetype alignment.","short_description":"A standard-library-only, SQLite-backed state machine engine and operator dashboard driving autonomous multi-agent sprint loops without recursive role collapse.","long_description":"sm3 (State Machine 3) packages genesis-sm, a DB-driven state machine engine for agentic development sprints. The CLI (sm) seeds SQLite, executes linear and branching sprint phase loops (POPULATE_BACKLOG, SPRINT_PLANNING, DESIGN, ARCHITECT, ENGINEER, TEST_BUILD, TEST_RUN, REVIEW, SPRINT_GATE), verifies strict file contracts, and dispatches OpenCode agent sessions. It includes a FastAPI + Jinja2 + Bootstrap 5 operator dashboard for deep event, phase, dispatch, and profile inspection. sm3 is also the artifact of the 'Trimurti' forked-context experiment where three archetype sibling sessions — Saraswati (Swan / Specification), Matsya (Fish / Implementation), and Kurma (Tortoise / Witnessing) — converged across parallel execution.","tags":["agents","multi-agent","orchestration","sqlite","state-machine"],"tech":["pyt documenting the 'Digital Darshana' framework for orchestrating teams of AI agents.","long_description":"seekdepth.org is a static GitHub Pages site (custom-bound to seekdepth.org via its CNAME) that hosts a long-form essay and a linked body of documentation. The main index.md is a ten-part essay tracing the author's move from using LLMs as tools to running decomposed, role-based agent pipelines and a 'Hypervisor' state machine. A darshana/ directory contains FRAMING.md, a README describing the 'Darshana' protocol (a mode-2 'awakening' ritual for agents), canon documents (stewards-origins, the-center, the-ascent, the-moon-in-water, the-protocol, emisary-contract, canon-annotations), and timestamped reflections. The repository is Markdown only; there is no application source code.","tags":["agentic-frameworks","ai-agents","darshana-protocol","essays","philosophy"],"tech":["github-pages","markdown","cname"],"category":"AI/ML Experiments","live_url":"https://seekdepth.org/","repo_url":"https://github.com/jpeckenpaugh/seekdepth.org","has_live_demo":true,"featured":false,"status":"active","confidence":"medium","notes":"CNAME contains seekdepth.org and the Pages probe redirected to https://seekdepth.org/, so the custom domain is used as live_url. Repo is Markdown-only (16 .md files, 18 files total) with no build config, so tech is limited to GitHub Pages/Markdown/CNAME. Related to ll-seekdepth-net: both are jpeckenpaugh projects under the shared 'seekdepth' brand, but they use different domains (this repo binds seekdepth.org; ll-seekdepth-net binds ll.seekdepth.net). No shared source or dependency is evident between them.","demos":[{"label":"Play","url":"https://seekdepth.org/"}],"thumb":"thumbnails/seekdepth.org.webp","updated_at":"2026-07-05T06:37:26Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":153,"live_final_url":"https://seekdepth.org/","live_error":null},{"key":"ai_chat_distil_01","repo":"ai_chat_distil_01","display_title":"Closed-System Speech POC","tagline":"Reconstructing canonical speech waveforms for a closed phrase set with lightweight LiteRT-friendly models.","short_description":"An experimental proof-of-concept that reconstructs canonical speech waveforms for a closed set of phrases using lightweight Keras models and LiteRT-friendly ops, with a local dashboard for training and validation.","long_description":"This repo is a proof-of-concept for reconstructing canonical speech waveforms for a closed set of phrases using lightweight models and LiteRT-friendly ops. It provides a CLI (main.py) and scripts to generate training assets from macOS `say`, train a small banded Keras reconstruction model, evaluate MAE/MSE against targets, and convert the SavedModel to TFLite with an optional parity check. A local dashboard supports adding words via TTS or microphone, recording mic audio to replace targets (with denoise/filter options), populating phoneme entries, training banded models, running validation/postulate modes, and generating text-only postulates. The demo surfaces a LiteRT web runtime and HTML pages for speech and TFLite demos.","tags":["litert","proof-of-concept","signal-processing","speech-synthesis","tensorflow"],"tech":["Python","TensorFlow","Keras","ai_edge_litert","TFLite","LiteRT.js","numpy","pronouncing","HTML","JavaScript","WASM"],"category":"AI/ML Experiments","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/ai_chat_distil_01","has_live_demo":false,"featured":false,"status":"experiment","confidence":"high","notes":"No GitHub Pages and no CNAME, so no live URL. Description and README self-describe this as an experimental proof-of-concept. Single initial commit window (created and last pushed 2026-01-11); 0 stars.","demos":[],"thumb":"thumbnails/ai_chat_distil_01.webp","updated_at":"2026-01-11T12:06:52Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"cde","repo":"cde","display_title":"Compiled Domain Expertise (CDE)","tagline":"Compiling bounded AI reasoning into static, deterministic instruction sets","short_description":"Compiled Domain Expertise (CDE) is an architectural specification that compiles bounded AI reasoning into a static, language-agnostic Domain Instruction Set, replacing runtime neural nets with a deterministic, sub-megabyte relational graph.","long_description":"CDE proposes severing knowledge acquisition from knowledge execution. At build time, high-capacity models operate offline as an empirical knowledge compiler (Empirical Knowledge Compilation, EKC) to explore a closed domain, extract candidate reasoning structures, and surface inferential dependencies. At runtime, only surviving validated structures execute after being lowered into a Domain Instruction Set (DIS). The Quantized Semantic Bottleneck Architecture (QSBA) uses an hourglass topology that decouples continuous, high-dimensional linguistic transducers from a discrete, integer-only core, targeting exact attribution, loud syntax checks, and microsecond execution on standard CPUs within a sub-megabyte budget. The repo includes the specification, a CCPA reference instance (QSBC), an algebra domain with an ingest/review workbench (FastAPI backend + React frontend), supporting dialogues, docs, and generated slide decks.","tags":["ai","deterministic-inference","knowledge-compilation","llm","symbolic-ai"],"tech":["python","fastapi","sqlalchemy","pymupdf","typescript","react","vite","tailwindcss"],"category":"AI/ML Experiments","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/cde","has_live_demo":false,"featured":false,"status":"experiment","confidence":"high","notes":"Dossier live probe list is empty; GitHub Pages disabled and homepage null, so no live demo. Primary artifact is an architectural specification (README) plus an algebra EKC workbench with a FastAPI/SQLAlchemy backend and React/Vite/Tailwind frontend. Apache-2.0 licensed, 0 stars, last pushed 2026-09-20.","demos":[],"thumb":"thumbnails/cde.webp","updated_at":"2026-09-20T18:01:52Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"qsbc","repo":"qsbc","display_title":"QSBC — Quantized Semantic Bottleneck Classifier","tagline":"Interpretable sentence classification via a semantic proposition bottleneck","short_description":"Infrastructure and experiments for QSBC, an interpretable sentence-classification architecture that inserts a human-meaningful semantic proposition bottleneck between input text and linear-probe prediction, applied to the CPRA subset of the C3PA privacy-policy dataset.","long_description":"QSBC replaces the direct text-to-label mapping of an uninterpretable transformer with a two-stage path: concept extraction, then a strictly linear probe, so concept attribution to class logits is analytically exact. This repo builds the data layer and experiments: a Dockerized PostgreSQL corpus of the parsed C3PA privacy policies matching the reference split, a chain-of-thought `cot` agent that generates atomic generalized rationales per sentence-label pair, the Phase 2 thoughts/ideas alphabet (statements clustered into canonical concepts), a FastAPI + Bootstrap SPA explorer, and Colab experiment notebooks (exp1-4) benchmarking the pipeline with a linear-probe ceiling reported at +9.8pt.","tags":["classification","interpretability","nlp","privacy-policies","semantic-bottleneck"],"tech":["python","fastapi","uvicorn","postgresql","docker","scikit-learn","sentence-transformers","jupyter"],"category":"AI/ML Experiments","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/qsbc","has_live_demo":false,"featured":false,"status":"experiment","confidence":"high","notes":"No live probe results (dossier live: []); has_pages false and homepage null, so no live_url. Runs locally via docker compose on http://localhost:8000.","demos":[],"thumb":"thumbnails/qsbc.webp","updated_ sizer","has_live_demo":false,"featured":false,"status":"prototype","confidence":"high","notes":"No GitHub Pages, homepage, or live probe results in dossier; no CNAME observed. Category chosen as AI/ML Experiments since it is a data-synthesis toolset for RAG development. Single scenario completed; reusability and evaluation artifacts remain future work.","demos":[],"thumb":"thumbnails/rag-data-synthesizer.webp","updated_at":"2026-10-08T08:36:14Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"hebrew-language-tutor","repo":"hebrew-language-tutor","display_title":"English / Hebrew Language Tutor","tagline":"Study, quiz, and exam modes for English-Hebrew vocabulary","short_description":"A FastAPI + SQLite web app with five English/Hebrew vocabulary lessons, study/quiz/exam modes, saved scores, and a dummy-gated admin area for editing lessons and vocab.","long_description":"A simple web application for learning English <-> Hebrew vocabulary. It ships five seeded lessons (10 vocab items each) with study, quiz, and exam modes, persists quiz/exam attempts as per-lesson score history, and includes a dummy-gated admin area for adding and editing lessons and vocabulary. The frontend is a plain HTML/CSS/JS single-page app using locally hosted Bootstrap 5.3.3, and the backend is a FastAPI service backed by SQLite, which serves the SPA and owns all application state. The repository contains two experiments: the primary client/server app built via a 9-stage decomposed role pipeline, and a single-pass static SPA proof-of-concept with hardcoded vocabulary under proof-of-concept/. README status is PASS based on a curl-driven API verification and static frontend review; known limitations include a dummy admin gate and in-memory tokens that don't survive restarts.","tags":["education","fastapi","hebrew","language-learning","sqlite","vocabulary"],"tech":["FastAPI","Uvicorn","Python","SQLite","JavaScript"," e (hi-IN / kn-IN), flip-to-reveal flashcards, per-lesson multiple-choice quizzes with instant feedback, a searchable glossary, and a dashboard with quiz score history, daily streaks, and per-word mastery tracked separately per language. Progress, language choice, and student name persist in localStorage, and the responsive layout adapts to any screen size. The README notably documents that the project was built entirely by three short-lived DeepSeek V4 Flash coding agents in OpenCode, with agent session screenshots included as evidence.","tags":["flashcards","hindi","kannada","language-learning","text-to-speech","vocabulary"],"tech":["HTML","CSS","JavaScript","Web Speech API","localStorage","Python"],"category":"Language Tools","live_url":"https://jpeckenpaugh.github.io/vibe-hindi-language-tutor/","repo_url":"https://github.com/jpeckenpaugh/vibe-hindi-language-tutor","has_live_demo":true,"featured":true,"status":"active","confidence":"high","notes":"GitHub Pages live demo returns HTTP 200. README describes project as v0.3, a work in progress. No license or homepage metadata found; built entirely by coding agents as a demonstration of agentic 'vibe coding'.","demos":[{"label":"Play","url":"https://jpeckenpaugh.github.io/vibe-hindi-language-tutor/"}],"thumb":"thumbnails/vibe-hindi-language-tutor.webp","updated_at":"2026-08-19T07:06:38Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":56,"live_final_url":"https://jpeckenpaugh.github.io/vibe-hindi-language-tutor/","live_error":null},{"key":"nexttext","repo":"nexttext","display_title":"nexttext","tagline":"Lightweight Python toolkit for neutralizing gendered language in AI text.","short_description":"A dependency-free Python library that debiases and rebias gendered terms in text labels using fast heuristics, for cleaning training data and filtering model outputs.","long_description":"nexttext is a lightweight Python toolkit for neutralizing and re-framing text to reduce noise, hidden skew, and unwanted artifacts in AI pipelines. It works on both human-annotated input labels and model-generated labels, using simple, fast heuristics to neutralise gendered or stereotypical language (debias) and optionally reintroduce controlled skew for testing and validation (rebias), including a context-aware strategy. It ships with no heavy dependencies, requires Python 3.9+, and is released under the MIT license, targeting tasks like training data cleanup, inference filtering, and standardization of labels across datasets.","tags":["ai-ethics","data-cleaning","debias","nlp","python-library","text-processing"],"tech":["Python","hatchling","pytest"],"category":"Language Tools","live_url":"https://jpeckenpaugh.github.io/nexttext/","demos":[{"label":"Play","url":"https://jpeckenpaugh.github.io/nexttext/"}],"repo_url":"https://github.com/jpeckenpaugh/nexttext","has_live_demo":true,"featured":true,"status":"active","confidence":"high","notes":"Published to GitHub Pages at https://jpeckenpaugh.github.io/nexttext/ (HTTP 200); previously repo-only. Also a reusable pip-installable library (pyproject name=nexttext, v0.1.0) with MIT license.","thumb":"thumbnails/nexttext.webp","updated_at":"2026-10-15T06:04:39Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":51,"live_final_url":"https://jpeckenpaugh.github.io/nexttext/","live_error":null},{"key":"apertiasm-en-es","repo":"apertiasm-en-es","display_title":"apertiasm-en-es","tagline":"Experimental WASM build of Apertium for English to Spanish translation","short_description":"An experimental WebAssembly build of the Apertium machine translation engine with the English/Spanish (eng-spa) language pair packaged for browser use.","long_description":"apertiasm-en-es packages the Apertium rule-based machine translation engine and the apertium-eng-spa language pair as WebAssembly for in-browser English-to-Spanish translation. The project is organized in stages: Stage 2 establishes a reproducible Emscripten toolchain producing apertium.js and apertium.wasm; Stage 3 fetches and packages the eng-spa language data with smoke-phrase validation; Stage 4 builds a framework-free standalone HTML/JS/CSS demo with an English input area, translate button, Spanish output, and runtime milestone panel; Stage 5 wires the real runtime command pipeline (lt-proc, apertium-tagger, apertium-pretransfer, apertium-transfer, and transfer preprocessing) in browser Web Workers; and Stage 5c emits a single direct WASM runtime module (apertium-runtime.js/wasm) exporting runtime status and translate_en_es. The demo attempts the direct runtime first, then the command runtime, then falls back to a Stage 2 bridge, with a Stage 2b probe attempting a full libxml2/lttoolbox/apertium-core WASM build.","tags":["apertium","emscripten","english-spanish","machine-translation","wasm"],"tech":["WebAssembly","Emscripten","JavaScript","HTML","CSS","Shell","Apertium","lttoolbox","libxml2"],"category":"Language Tools","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/apertiasm-en-es","has_live_demo":false,"featured":false,"status":"experiment","confidence":"high","notes":"Description calls it experimental. No GitHub Pages (has_pages false) and no CNAME, so no live URL; demo is served locally via scripts/stage4/serve-demo.sh. Repo has 0 stars and no license.","demos":[],"thumb":"thumbnails/apertiasm-en-es.webp","updated_at":"2026-03-03T02:50:51Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"c3pa-sentence-label-parser","repo":"c3pa-sentence-label-parser","display_title":"C3PA Sentence-Level Candidate Parser","tagline":"Parse C3PA privacy-policy annotations into aligned sentence-level ML dataset candidates.","short_description":"A Python parser that extracts grammatical sentences from C3PA privacy-policy HTML and aligns the dataset's verbatim annotations back to those sentences, producing ready-to-use sentence-level ML dataset candidates.","long_description":"A Python parser for turning the C3PA Dataset (California Consumer Privacy Act annotations on privacy policies) into structured sentence-level dataset candidates for ML/AI training and evaluation. It extracts readable policy text from the original HTML documents, segments it into full grammatical sentences with spaCy, and aligns C3PA annotation evidence back to those reconstructed sentences using a three-tier algorithm (sub-sentence fragments, multi-sentence paragraph spans, and partial token-overlap matches). Annotation labels are preserved verbatim. Outputs are split into single-label, high-confidence single-label, multi-label, and unannotated sentence CSVs, plus unmatched and ambiguous annotation files, for use in sentence classification, policy auditing, retrieval, and negative sampling.","tags":["annotation","ccpa","dataset","nlp","privacy-policy","sentence-segmentation"],"tech":["Python","spaCy","BeautifulSoup4","Bash","CSV"],"category":"Language Tools","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/c3pa-sentence-label-parser","has_live_demo":false,"featured":false,"status":"prototype","confidence":"high","notes":"No homepage, no GitHub Pages, no CNAME. Language is Python; requirements.txt lists beautifulsoup4>=4.12.0 and spacy>=3.7.0. Ships install.sh and parse.sh plus a committed output/ directory of generated CSVs. Created and last pushed 2026-09-18 (single-day, 0 stars, no license).","demos":[],"thumb":"thumbnails/c3pa-sentence-label-parser.webp","updated_at":"2026-09-18T21:15:58Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"snow-compliance-demo","repo":"snow-compliance-demo","display_title":"Snowflake Compliance Demo","tagline":"Board-review plan and simulated architecture for a Snowflake legal-compliance platform (companion to working POC snow-cuad)","short_description":"A board-review site and working offline proof of concept for a Snowflake legal-compliance platform built on the public CUAD contract dataset plus synthetic law-firm records, covering the data model, row-access policies, column masking, risk views, and audit queries.","long_description":"The Snowflake Compliance Demo stages a proposed Snowflake integration for legal contract review. It pairs a board-facing static site — purpose, ten recommendations, delivery phases, architecture, data foundation, confidentiality model, risk analysis, audit verification, and a Snowflake-options comparison — with a working Python + SQLite proof of concept that enforces matter-level access control and records an audit log, designed to port directly to Snowflake. Contract data comes from the public Contract Understanding Atticus Dataset (CUAD, CC BY 4.0), normalized into RAW CSVs by ingest/load_cuad.py; clients, matters, staff, assignments, and approvals are synthetic data generated with Faker. The POC simulates Snowflake role context, row-access policies, masking, and query history offline (poc/snowflake_sim.py), so no Snowflake account is required. The repository also ships the target Snowflake DDL (sql/01-05: database and roles, data model, row access and masking, risk views, audit queries), a Python offline-SQL portability harness with CI, and a clickable interactive demo (demo/index.html) with role-based login. The Snowflake component is simulated for now: offline emulators run SQL but do not enforce governance, so row-access-policy and masking validation is deferred to a free trial. The contract-risk rubric is simulated and is not legal advice.","tags":["audit","cuad","data-governance","legal-tech","proof-of-concept","row-access-policy","snowflake"],"tech":["Python","Snowflake","SQL","SQLite","Faker","HTML","CSS","GitHub Pages","GitHub Actions"],"category":"Dev Tools","live_url":"https://jpeckenpaugh.github.io/snow-compliance-demo/","demos":[{"label":"Overview","url":"https://jpeckenpaugh.github.io/snow-compliance-demo/"},{"label":"Architecture","url":"https://jpeckenpaugh.github.io/snow-compliance-demo/architecture.html"},{"label":"POC & findings","url":"https://jpeckenpaugh.github.io/snow-compliance-demo/poc.html"},{"label":"Interactive demo","url":"https://jpeckenpaugh.github.io/snow-compliance-demo/demo/index.html"}],"repo_url":"https://github.com/jpeckenpaugh/snow-compliance-demo","has_live_demo":true,"featured":true,"status":"board review","confidence":"high","notes":"Companion to the working snow-cuad POC. Repo snow-compliance-demo auto-publishes to GitHub Pages (legacy build from `/`) on every push to main; live at jpeckenpaugh.github.io/snow-compliance-demo/. CUAD is CC BY 4.0 with attribution retained; all firm records are synthetic; the risk rubric is simulated, not legal advice.","thumb":"thumbnails/snow-compliance-demo.webp","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":53,"live_final_url":"https://jpeckenpaugh.github.io/snow-compliance-demo/","live_error":null,"updated_at":"2026-10-16T18:40:31Z"},{"key":"snow-cuad","repo":"snow-cuad","display_title":"Snow CUAD","tagline":"Automated first POC build of the Snowflake contract intelligence platform over 510 CUAD contracts.","short_description":"The clean, automated first POC build of the Snowflake legal contract compliance and intelligence idea. Loads the 510-contract CUAD corpus into Snowflake with full-text clause search, related-contract scoring, RBAC roles (lawyer, auditor, admin), and an append-only access audit log.","long_description":"Snow CUAD implements the clean, automated first POC build of the Snowflake legal-compliance platform idea (paired with the snow-compliance-demo board-review architecture). Using the public Contract Understanding Atticus Dataset (CUAD v1 — 510 commercial M&A contracts annotated across 41 legal clause categories), this repository delivers an end-to-end reproducible pipeline from 'make pipeline' through a self-hosted Streamlit & Related Contracts","body":"Filter by 41 legal clause categories, agreement types, jurisdictions, and counterparties, and view automatically scored related contracts based on clause overlap."},{"title":"🛡️ Least-Privilege RBAC & Append-Only Audit Logging","body":"Authenticate as Lawyer, Auditor, or Admin under dedicated service credentials (never ACCOUNTADMIN) while all logins, clause searches, and document views stream to Snowflake audit tables."}]},{"key":"sprites-livive-net","repo":"sprites-livive-net","display_title":"Sprites · Model-to-Sprite Workshop","tagline":"Turn 3D GLB/glTF models into sprite sheets and single sprites in your browser","short_description":"A browser-based 3D-to-sprite workshop for previewing turntable views and animation frames, deriving 8 diagonal directional angles with shear/rotation warping, and exporting adaptive-palette WebP or PNG sprite sheets.","long_description":"Sprites is a static, browser-based 3D-to-sprite workshop companion tool for the Oblique 2.5D engine. Load GLB/glTF models with Three.js, preview turntable multi-angle views and animated walk cycles, configure camera pitch (0° to 80°), view count, and output dimensions, and inspect live 16-direction matrices with runtime shear/rotational warping. Export row-major PNG or adaptive-palette WebP sprite sheets with embedded XMP metadata, or capture single angles cropped to pixel bounding boxes.","tags":["3d-models","game-assets","glb","gltf","sprite-sheets","threejs","webgl","dev-tools"],"tech":["JavaScript","HTML","CSS","Three.js","WebGL","Canvas"],"category":"Dev Tools","live_url":"https://sprites.livive.net/","demos":[{"label":"Open the sprite workshop","url":"https://sprites.livive.net/"},{"label":"Oblique Sandbox","url":"https://oblique.livive.net/"}],"repo_url":"https://github.com/jpeckenpaugh/sprites-livive-net","has_live_demo":true,"featured":true,"status":"live","confidence":"high","notes":"Static browser-based 3D-to-sprite workshop loading Three.js from jsDelivr. Companion asset-preparation tool for Oblique 2.5D scene sandbox.","thumb":"thumbnails/sprites-livive-net.webp","updated_at":"2026-10-18T02:30:00Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-18T07:09:07.422Z","live_latency_ms":180,"live_final_url":"https://sprites.livive.net/","live_error":null,"how_to_play":[{"title":"🧊 1. Select Model & Multi-Directional Mode","body":"Choose from 25+ built-in GLB/glTF character and prop models, pick an animation clip (e.g. walk cycle), set resolution from 64×64 to 1080p, and preview simultaneous 8-directional animated loops."},{"title":"📐 2. Pitch, Angle & Algorithmic Diagonal Warping","body":"Tweak camera pitch (0° level to 80° top-down) and observe the 5×5 directional matrix displaying rendered cardinal poses alongside real-time shear/rotation derived diagonal angles."},{"title":"📦 3. Crop Bounding Box & Export Sprite Atlas","body":"Isolate single angles with tight alpha-channel auto-cropping, or export full row-major sprite sheets with adaptive 256-color palette quantization to WebP (lossless with XMP) or 32-bit PNG."}]},{"key":"roblox-api-database","repo":"roblox-api-database","display_title":"Roblox API Database","tagline":"Git-tracked Roblox Client and Studio API dumps for offline schema lookup","short_description":"A git-tracked database of official Roblox Client and Studio API dumps, with Python CLI tools for offline schema lookup, static analysis, and CI/CD validation.","long_description":"Roblox API Database is a versioned, git-tracked collection of official Roblox Client and Studio API dumps fetched from Roblox CDN endpoints. It stores timestamped JSON API snapshots under versions/ with a current/ symlink to the latest dump, and ships lightweight self-contained Python CLI tools (query_api.py, validate_api.py, fetch_api_dump.sh) for looking up enums, classes, inheritance, properties, methods, and events without reading the multi-megabyte dump directly. It is designed for offline engine schema lookup, static analysis, and programmatic validation in CI/CD pipelines, and can be added to projects as a git submodule. Only Python 3.x and the standard library are required; a unittest suite and valid/invalid Lua sample folders support testing.","tags":["api","ci-cd","cli","database","roblox","static-analysis"],"tech":["Python","Lua","JSON","Shell","Git"],"category":"Dev Tools","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/roblox-api-database","has_live_demo":false,"featured":true,"status":"active","confidence":"high","notes":"No live probe results and no GitHub Pages/CNAME, so no live demo. Reusable CLI tooling and git-submodule design; recently pushed, not archived.","demos":[],"thumb":"thumbnails/roblox-api-database.webp","updated_at":"2026-06-26T15:17:00Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"gemini_bootstrap","repo":"gemini_bootstrap","display_title":"Gemini CLI Agent Bootstrap","tagline":"Persistent instructions, directives and memory for the Gemini CLI agent","short_description":"A Markdown-based framework that bootstraps Google Gemini Agent CLI sessions with persistent instructions, custom directives and session memory to reduce context decay, role drift and recall gaps.","long_description":"gemini_bootstrap is a framework for customizing interactive sessions with the Google Gemini Agent CLI. Its core is gemini_bootstrap.md, an operating manual the agent reads at the start of a session to configure behavior. It provides guiding principles, an extensible shorthand directive language, snapshot/undo for files, automatic 5-letter directory aliases for workspace folders, and session logging via templates. It targets problems like context decay, role drift, state desynchronization and directive sprawl, and uses Git as a persistence layer so the configuration and logs stay consistent across environments. Setup involves creating a ~/gemini/ workspace, cloning the repo, and optionally auto-loading the bootstrap on session start.","tags":["ai-agent","cli","context-management","gemini","llm","prompt-engineering"],"tech":["Markdown","Google Gemini CLI","Git"],"category":"Dev Tools","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/gemini_bootstrap","has_live_demo":false,"featured":false,"status":"active","confidence":"high","notes":"No live probe results in dossier (live: []) and has_pages is false, so no live demo. Pure Markdown repo (5 .md files, no manifests); tech inferred from README references to Markdown, Gemini CLI and Git. MIT licensed, 0 stars.","demos":[],"thumb":"thumbnails/gemini_bootstrap.webp","updated_at":"2025-10-12T05:27:42Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"open-code-workflows","repo":"open-code-workflows","display_title":"Open Code Workflows","tagline":"Role-based agent pipelines that turn a seed concept into a web app","short_description":"Reusable Markdown-defined agent pipelines (build, enhancements, debug) that drive a staged, human-checkpointed build of a web app from a seed concept via stage-managed sub-agents.","long_description":"Open Code Workflows is a reusable set of role-based pipelines for building web apps with an agentic coding assistant. Given a short seed concept, the workflows drive a staged build with human checkpoints through clearly separated roles: concept (human-supplied), feature decomposition, feature briefs, system engineering, architecture, backend, frontend, verification, and documentation. Three pipelines are provided: build (stages 01-09), enhancements (stages 01-10), and debug (stages 01-03). A meta Stage Manager role sequences, dispatches, gates, and audits each stage, spawning and resuming sub-agents per role. The repo includes ready-made seed concepts such as a language tutor, job tracker, client project tracker, sales/inventory tracker, plant nursery, and capstone project tracker. Each generation follows a fixed artifact chain (concept to features to briefs to env scripts to architecture to backend to frontend to verification to README); stages commit and push as their final step. It was designed and validated in OpenCode with DeepSeek V4 Flash but is model- and agent-agnostic, written as plain Markdown instructions.","tags":["agent-workflows","code-generation","opencode","pipelines","sub-agents","web-apps"],"tech":["Markdown","OpenCode","DeepSeek V4 Flash","FastAPI","SQLite","Bootstrap"],"category":"Dev Tools","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/open-code-workflows","has_live_demo":false,"featured":false,"status":"active","confidence":"high","notes":"No homepage, no GitHub Pages, and empty live probe; no live demo. Repo is Markdown-only (37 .md files) with no manifests. License: MIT. Model- and agent-agnostic instructions validated in OpenCode; notable but not a library and has no live demo, so featured is false.","demos":[],"thumb":"thumbnails/open-code-workflows.webp","updated_at":"2026-08-30T19:09:41Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"tc-livive-org","repo":"tc-livive-org","display_title":"Training vs. Inference","tagline":"Interactive AI Learning Lab demystifying Training, Inference, and Hardware Memory with zero black boxes.","short_description":"A browser-based interactive learning lab that demystifies how AI models learn and predict through inspectable hardware abstractions, disk-to-RAM compilation, and hand-verifiable math.","long_description":"Training vs. Inference is an inspectable single-page educational app built with a strict Zero-Black-Boxes philosophy. Designed to teach non-technical leaders and engineers how AI actually works at the hardware level, it contrasts dormant disk storage against active RAM lookups, walks through a two-step training compilation pipeline, and exposes model blind spots on out-of-vocabulary words. Every token tally, weight, smoothing calculation, and confidence score is rendered transparently in the live DOM with zero hidden libraries.","tags":["ai","education","interactive","machine-learning","neural-networks","sentiment-analysis"],"tech":["HTML5","CSS3","JavaScript","GitHub Pages"],"category":"Education & Teaching","live_url":"https://tc.livive.org/","repo_url":"https://github.com/jpeckenpaugh/tc-livive-org","has_live_demo":true,"featured":true,"status":"active","confidence":"high","notes":"CNAME file points to tc.livive.org, so the custom https domain is preferred over the jpeckenpaugh.github.io/tc-livive-org/ Pages URL (live probe returned 200). No README; evidence drawn from index.html title and the three spec markdown files (concept_specification.md, reframed.md, spec_rev_2.md). Zero external dependencies per specs.","demos":[{"label":"Launch Lab","url":"https://tc.livive.org/"}],"thumb":"thumbnails/tc-livive-org.webp","updated_at":"2026-10-18T07:09:07.422Z","live_ok":true,"live_status":200,"live_checked_at":"2026-10-17T00:25:35Z","live_latency_ms":140,"live_final_url":"https://tc.livive.org/","live_error":null,"how_to_play":[{"title":"💾 1. Disk Storage vs. Active RAM","body":"Observe how raw training samples sit dormant on SSD disk storage with zero predictive power until an explicit CPU compilation step distills them into a compact lookup table loaded into RAM."},{"title":"🎯 2. Uncover AI Blind Spots (OOV)","body":"Evaluate unseen sentences against small models in View 2 to discover why models fail on Out-of-Vocabulary (OOV) words, falling back to an uncalibrated 50/50 coin toss."},{"title":"📈 3. Data Scaling & Token Coverage","body":"Scale the training dataset in View 3 to observe active RAM vocabulary expand from 6 to 38 tokens, instantly resolving blind spots and achieving high-confidence predictions."},{"title":"🔬 4. Inspect Live Laplace Smoothing Math","body":"Type your own sentences in View 4 and watch the processor calculate confidence in real time using inspectable Laplace smoothing: Score = (P + 1) / (P + N + 2)."}]},{"key":"docker-sql-lessons","repo":"docker-sql-lessons","display_title":"Docker SQL Lessons","tagline":"Hands-on Docker lessons for support engineers moving into DevOps","short_description":"A two-part, self-contained lesson series that builds small Dockerized Python apps to teach containers, volumes, and SQLite-backed persistence.","long_description":"Docker Lessons is a hands-on teaching series aimed at support engineers transitioning into DevOps. Each numbered folder is an independent lesson that builds a small Dockerized Python app and ships with its own README covering goals, files, and exercises. Lesson 1 (01-monitor) runs a long-lived daemon that samples CPU/RAM/Disk on an interval, stores each snapshot in SQLite, and lets students query the history with the sqlite3 CLI, teaching images vs containers, Dockerfile basics, bind mounts vs named volumes, and env-var config. Lesson 2 (02-lesson-catalogue) containerizes a FastAPI JSON API with a SQLite (SQLAlchemy) backend that tracks lessons and notes, covering port exposure, hot-reload via bind mount, CRUD endpoints, and Pydantic schemas. Prerequisites are Docker Desktop and basic command-line familiarity.","tags":["devops","docker","fastapi","sqlite","tutorial"],"tech":["Docker","Docker Compose","Python 3.12","SQLite","FastAPI","SQLAlchemy","Pydantic","psutil"],"category":"Education & Teaching","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/docker-sql-lessons","has_live_demo":false,"featured":false,"status":"active","confidence":"high","notes":"No description or homepage set on GitHub; no CNAME and Pages disabled, so no live URL. 18 files across two lessons; top-level docker-compose.yml runs the Lesson 1 monitor service. Uses psutil==6.1.0 pinned, other deps unpinned.","demos":[],"thumb":"thumbnails/docker-sql-lessons.webp","updated_at":"2026-08-16T20:55:37Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"fast-ttt","repo":"fast-ttt","display_title":"fast-ttt","tagline":"\"Look Ma, No Browser!\" — Two-player ASCII Tic-Tac-Toe played entirely over curl and plain-text HTTP (Act II of the Tic-Tac-Toe Trilogy).","short_description":"\"Look Ma, No Browser!\" — Play two-player ASCII Tic-Tac-Toe over curl and plain-text HTTP backed by FastAPI, SQLAlchemy, and SQLite.","long_description":"Act II of the Tic-Tac-Toe Architecture Trilogy strips away HTML, CSS, JavaScript, and even JSON to teach raw client-server fundamentals. Two players (or scripts) compete entirely via curl requests against a FastAPI + SQLAlchemy + SQLite backend that responds with plain-text ASCII boards, atomic move validation, and highlighted winning lines.","tags":["cli","game","http","plain-text","teaching","tic-tac-toe"],"tech":["Python","FastAPI","uvicorn","SQLAlchemy","SQLite","pydantic","pytest","httpx"],"category":"Education & Teaching","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/fast-ttt","has_live_demo":false,"featured":false,"status":"prototype","confidence":"high","notes":"No GitHub Pages and no CNAME, so live_url is null. Positioned by the README as a teaching tool for client/server concepts rather than a standalone game, hence Education & Teaching. Local-only server at 0.0.0.0:8000.","demos":[],"thumb":"thumbnails/fast-ttt.webp","updated_at":"2026-10-18T07:09:07.422Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null,"how_to_play":[{"title":"🚀 1. Boot the Server (./install.sh && ./run.sh)","body":"Clone fast-ttt and run ./install.sh && ./run.sh. Uvicorn boots on http://localhost:8000 and automatically creates the relational SQLite database (src/data.db)."},{"title":"💻 2. Play From Two Terminals Over curl","body":"Run curl http://localhost:8000/games/new to start a match, then alternate moves with curl http://localhost:8000/games/1/player/X/move/5 (or let the server pick a move via /games/1/auto)."},{"title":"🛡️ 3. Atomic SQLite State & Plain-Text Errors","body":"Every request returns pure text/plain ASCII grids. Out-of-turn or occupied-square moves return HTTP 409 Conflict with the current board and error message; completed games highlight the winning line ([X]|[X]|[X])."}]},{"key":"python_classes","repo":"python_classes","display_title":"Python Classes Demo","tagline":"Progressive Python OOP demos with a food domain: inheritance and composition.","short_description":"A small, progressive set of Python examples demonstrating classes, inheritance, composition, polymorphism, and simple stateful business rules using a food-themed domain.","long_description":"Python Classes Demo is a small, progressive demonstration of Python object-oriented programming built around a food-themed domain. Base classes and subclasses are defined in food.py (Food with Fruit, Meat, and Beverage) and person.py (Person with Vegetarian), while meal.py illustrates composition through a Meal that contains multiple Food items. The examples show inheritance and method overriding (Fruit.eat, Meat.eat, Beverage.drink), composition, polymorphism, and state and validation held inside methods. Simple domain rules are modeled, including mandatory hand-washing before eating or drinking, requiring fruit to be washed and ripe and meat to be cooked before eating, vegetarian restrictions, allergies, a one-fruit limit for diabetics, an age 21+ check for alcoholic beverages, and people only becoming full at the end of a meal. Eight numbered example scripts progress from a minimal Person and Food case (example01.py) through cooking, washing/ripening, allergies and dietary limits, beverages, and a full Meal demo (example.py). Each example runs directly with python example01.py, and no manifest or third-party dependencies are present.","tags":["composition","education","inheritance","oop","python","tutorial"],"tech":["Python"],"category":"Education & Teaching","live_url":null,"repo_url":"https://github.com/jpeckenpaugh/python_classes","has_live_demo":false,"featured":false,"status":"prototype","confidence":"high","notes":"Dossier live probe list is empty and has_pages is false, so no live demo exists and live_url is null. No license declared and no manifests. Content is 11 Python files plus README.md (13 files total), a self-contained command-line teaching demo with no dependencies.","demos":[],"thumb":"thumbnails/python_classes.webp","updated_at":"2026-02-08T02:42:39Z","live_ok":null,"live_status":null,"live_checked_at":null,"live_latency_ms":null,"live_final_url":null,"live_error":null},{"key":"c3pa-explorer","repo":"c3pa-explorer","display_title":"C3PA Explorer","tagline":"In-browser explorer for the C3PA privacy-policy dataset","short_description":"A proof-of-concept web app for exploring the C3PA Dataset (400 expert-annotated CCPA/CPRA privacy policies) at both the source level (verbatim annotator spans) and the deterministically re-extracted derived level.","long_description":"C3PA Explorer is a proof-of-concept web app for exploring the C3PA Dataset (400 expert-annotated privacy policies, CCPA/CPRA) at both the source level (verbatim annotator spans) and the derived level (deterministically re-extracted text units). It ships two runtimes sharing one SPA and SQLite schema: a FastAPI edition with a Python backend over a normalized SQLite database, and a browser edition running entirely in-browser on sql.js (SQLite compiled to WebAssembly) against a prebuilt, signed snapshot. The derived layer is produced by backend/extract.py, a fully deterministic rule-based pipeline (no trained models) that drops chrome, extracts leaf text blocks, merges lead-ins with lists, splits sentences with abbreviation/URL/email guards, classifies units as sentence or typed fragment, and performs 3-tier annotation re-alignment. A dashboard shows corpus stats and label distributions; documents can be browsed and searched, ll, globally distributed firm to view and maintain information about the companies it works with. It distinguishes structured company data (stored in a relational database) from files and generated artifacts (stored as object-like files on disk), and is meant as a lightweight backbone for other internal workflows rather than a full CRM. Features include browsing and searching companies, country filtering, editable company profiles, standardized industries and locations, per-company references, news and logos, file/artifact upload and download, and one-page PDF summary generation. Sprint 03 added role-based access (guest, read-only, user, admin), admin user management, and optional Google SSO. The backend is FastAPI on async SQLAlchemy 2.0 with SQLite and versioned Alembic migrations, auth via fastapi-users with cookie sessions, and a static Bootstrap SPA frontend served by the app. It also ships OpenCode tools and agents that use the same authenticated API.","tags":["company-management","company-profiles","crm","document-generation","fastapi","internal-tool","internal-tools","spa","sqlite"],"tech":["Docker","fpdf2","FastAPI","aiosqlite","fastapi-users","Python","SQLAlchemy","SQLite","Bootstrap","Alembic","JavaScript"],"category":"Web Apps & Prototypes","live_url":"https://jpeckenpaugh.github.io/ch/","repo_url":"https://github.com/jpeckenpaugh/company-hub","has_live_demo":true,"featured":true,"status":"prototype","confidence":"high","notes":"No homepage, no GitHub Pages, no CNAME, and no live URL in the dossier, so live_url is null. Self-hosted app run via ./run.sh (uvicorn on 127.0.0.1:8000); login required. No license specified. Actively developed through sprints 01-03 as of the last push (2026-09-06). | ch: Live probe returned 200 with title 'Company Hub — Personal workspace'. Written in JavaScript by language stat but is primarily a Python/FastAPI app with a Bootstrap SPA frontend. No license or stars (0).","repos":["company-hub","ch"],"demos":[{"label":"Play","u
